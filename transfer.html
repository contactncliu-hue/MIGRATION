<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOO - Transfer</title>

  <!-- ===== VISIBLE ERROR CATCHER (loads first, before anything else) ===== -->
  <script>
    (function () {
      function showError(text) {
        var box = document.createElement('div')
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e03131;color:#fff;' +
          'padding:12px 16px;font-size:13px;font-family:monospace;z-index:999999;' +
          'white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.3);'
        box.textContent = text
        var closeBtn = document.createElement('span')
        closeBtn.textContent = ' ✕'
        closeBtn.style.cssText = 'float:right;cursor:pointer;font-weight:bold;'
        closeBtn.onclick = function () { box.remove() }
        box.appendChild(closeBtn)
        if (document.body) document.body.appendChild(box)
        else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box) })
      }
      window.showAppError = showError
      window.addEventListener('error', function (e) {
        showError('JS ERROR: ' + e.message + '\n(' + (e.filename || '') + ':' + e.lineno + ':' + e.colno + ')')
      })
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason)
        showError('PROMISE ERROR: ' + reason)
      })
    })()
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; display: flex; min-height: 100vh; background: #f4f5fa; overflow-x:hidden; }

    /* ================= SIDEBAR (beach-themed design, matches index.html — sidebar2.PNG) ================= */
    @font-face {
      font-family: 'Daruma Drop One';
      src: url('assets/fonts/DarumaDropOne-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* Sidebar-only, per-language display fonts. Korean uses KERISKEDU,
       Vietnamese uses StreetSignSans, Chinese (Simplified) uses
       SentyWatermelon -- everything else (EN/FR/PT) keeps Daruma Drop One. */
    @font-face {
      font-family: 'KERISKEDU';
      src: url('assets/fonts/KERISKEDU_B.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'StreetSignSans';
      src: url('assets/fonts/StreetSignSans_1.3.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SentyWatermelon';
      src: url('assets/fonts/SentyWatermelon.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* --sidebar-w is computed in JS from assets/sidebar2.PNG's own natural
       width/height at the current viewport height, so the sidebar's box is
       always exactly the image's own aspect ratio. 240px is only the
       fallback used for one frame before JS measures the image. */
    .sidebar{
      width:var(--sidebar-w, 240px);
      border-right:none;
      display:flex; flex-direction:column; padding:28px 0 2px 0;
      transition:margin-left .35s ease, opacity .35s ease, width .1s ease;
      z-index:70;
      --sidebar-font:'Daruma Drop One';
      font-family:var(--sidebar-font), sans-serif;
      color:#fff;
      position:fixed; top:0; left:0;
      height:100vh;
      overflow:hidden;
      /* Fallback only -- shown for a frame before JS sizes the sidebar to
         the image, or if the PNG fails to load entirely. */
      background-color:#2AA9F2;
    }

    .sidebar-bg{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      z-index:0;
      pointer-events:none;
    }

    .welcome-block{
      position:relative; z-index:2;
      flex-shrink:0;
      display:flex; align-items:center; gap:14px;
      padding:0 24px 30px 24px;
    }
    .user-avatar{
      width:56px; height:56px; border-radius:50%;
      background:#FFF6C9; color:#2AA9F2;
      display:flex; align-items:center; justify-content:center;
      font-weight:400; font-size:22px; flex-shrink:0;
      font-family:var(--sidebar-font), sans-serif;
      position:relative; overflow:hidden;
    }
    .user-avatar.admin{ color:#B4784E; } /* brown "A" on the same pale circle */
    .welcome-text{ display:flex; flex-direction:column; min-width:0; }
    .welcome-label{
      font-size:20px; color:#fff; letter-spacing:.5px; line-height:1.15;
    }
    .user-name{
      font-size:12px; color:rgba(255,255,255,.85); margin-top:2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .user-role{ display:none; } /* role no longer shown in the new layout */

    .sidebar-nav{ position:relative; z-index:2; display:flex; flex-direction:column; gap:24px; margin-top:6px; flex-shrink:0; }
    .nav-link{
      display:block;
      padding:14px 20px 14px 24px;
      color:#fff; text-decoration:none;
      font-family:var(--sidebar-font), sans-serif;
      font-weight:400; font-size:21px; letter-spacing:.5px;
      text-transform:uppercase;
      white-space:nowrap;
      background-image:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,0) 85%);
      background-repeat:no-repeat;
      background-size:112% 100%;
      background-position:-12px 0;
      border-radius:0 40px 40px 0;
      transition:background-image .2s ease;
    }
    .nav-link:hover{ background-image:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,.25) 90%); }
    .nav-link.active{ background-image:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,.35) 90%); }

    .sidebar-bottom{
      position:relative; z-index:2;
      padding:28px 24px 0 24px; flex-shrink:0;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      border-top:none;
      margin-top:auto; /* keeps LOG OUT / language pinned to the bottom of the sidebar */
    }
    .lang-select{
      padding:8px 14px; border-radius:16px; border:none;
      background:rgba(20,20,30,.4); color:#fff;
      font-family:var(--sidebar-font), sans-serif;
      font-weight:400; font-size:14px; cursor:pointer;
      -webkit-appearance:none; appearance:none;
      text-align:center;
    }
    .logout-btn{
      background:#FFAFAF; border:none; color:#E85454;
      padding:8px 20px; border-radius:16px;
      font-family:var(--sidebar-font), sans-serif;
      font-weight:400; font-size:14px; text-transform:uppercase; cursor:pointer;
      white-space:nowrap;
    }
    .logout-btn:hover{ background:#ff9d9d; }
    .logout-btn:disabled{ opacity:.6; cursor:default; }

    /* Per-language sidebar fonts -- everything else stays on Daruma Drop One */
    body[data-lang="ko"] .sidebar{ --sidebar-font:'KERISKEDU'; }
    body[data-lang="vi"] .sidebar{ --sidebar-font:'StreetSignSans'; }
    body[data-lang="zh-CN"] .sidebar{ --sidebar-font:'SentyWatermelon'; }

    body.sidebar-hidden .sidebar{ margin-left:calc(-1 * var(--sidebar-w, 240px)); opacity:0; pointer-events:none; }

    .sidebar-backdrop{ display:none; }

    .menu-toggle{
      position:fixed; top:24px; right:32px; z-index:80;
      width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
      background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    }
    .menu-toggle span{ width:22px; height:3px; border-radius:2px; background:#3B5BDB; display:block; transition:transform .25s ease, opacity .25s ease; }
    body.sidebar-hidden .menu-toggle span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
    body.sidebar-hidden .menu-toggle span:nth-child(2){ opacity:0; }
    body.sidebar-hidden .menu-toggle span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

    @media (max-width:760px){
      .sidebar{ position:fixed; inset:0 auto 0 0; z-index:70; }
      body.sidebar-hidden .sidebar{ margin-left:calc(-1 * var(--sidebar-w, 240px)); }
      .main-content{ margin-left:0; }

      .sidebar-backdrop{
        display:none; position:fixed; inset:0; background:rgba(20,20,30,.4); z-index:65;
      }
      body:not(.sidebar-hidden) .sidebar-backdrop{ display:block; }
    }

    /* ================= MAIN / HERO STAGE ================= */
    .main-content { flex: 1; position:relative; overflow:hidden; min-height:100vh; margin-left:var(--sidebar-w, 240px); transition:margin-left .1s ease; }
    body.sidebar-hidden .main-content{ margin-left:0; }

    .transfer-stage{
      position:relative;
      width:100%; height:100vh;
      overflow:hidden;
      background:linear-gradient(160deg, #fff6e0 0%, #fdf3da 22%, #eef4e4 55%, #ffffff 100%);
    }

    .scene{
      position:absolute; left:50%; bottom:0;
      width:max(100vw, 177.7vh);
      aspect-ratio:2560/1451;
      transform:translateX(-50%);
      opacity:0;
      transition:opacity 1.4s ease;
    }
    .stage-ready .scene{ opacity:1; }

    .deco-bg{
      position:absolute; inset:0;
      pointer-events:none;
    }
    .deco-bg img{ width:100%; height:100%; display:block; object-fit:fill; }

    .arch-card{
      position:absolute; left:32%; bottom:0; width:36%;
      z-index:5;
      opacity:0;
      transform:translateY(90px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .2s, opacity 1.6s ease .2s;
    }
    .stage-ready .arch-card{ opacity:1; transform:translateY(0); }
    .arch-bg{ width:100%; display:block; pointer-events:none; }

    .header-ribbon{
      position:absolute; left:50%; top:11%; width:100%;
      z-index:8;
      pointer-events:none;
      overflow:hidden;
      opacity:0;
      transform:translate(-50%, 60px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .6s, opacity 1.6s ease .6s;
    }
    .stage-ready .header-ribbon{ opacity:1; transform:translate(-50%, 0); }
    .header-ribbon img{ width:100%; display:block; clip-path:inset(0 0 4% 0); }

    .bottom-fade{
      position:absolute; left:0; right:0; bottom:0; height:10%;
      background:linear-gradient(to bottom, rgba(253,243,218,0) 0%, rgba(253,243,218,.9) 65%, #fdf3da 100%);
      z-index:20; pointer-events:none;
    }

    .transfer-btn{
      position:absolute; left:50%; top:62%; width:26%;
      z-index:30;
      border:none; cursor:pointer; padding:0;
      background:transparent;
      opacity:0;
      transform:translateX(-50%) translateY(40px) scale(.94);
      transition:filter .16s ease, opacity .5s cubic-bezier(.22,.68,0,1.01) .15s, transform .5s cubic-bezier(.22,.68,0,1.01) .15s;
    }
    .stage-ready .transfer-btn{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    .transfer-btn img{ width:100%; display:block; }
    .transfer-btn .btn-label{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:1.6vw; letter-spacing:.08vw;
      color:#fffaf0;
      text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
      transition:text-shadow .12s ease;
    }

    .status-open .header-ribbon,
    .status-open .transfer-btn{
      opacity:0 !important;
      transform:translate(-50%, 60px) !important;
      pointer-events:none;
      transition:transform .5s cubic-bezier(.22,.68,0,1.01), opacity .4s ease;
    }
    .status-open .transfer-btn{ transform:translateX(-50%) translateY(60px) scale(.96) !important; }

    .arch-card.img-failed { background:#fff8ea; border-radius:24px; aspect-ratio:3/4; }
    .transfer-btn.img-failed { background:#f2a90f; border-radius:14px; aspect-ratio:5/1; }

    .status-card{
      position:absolute; top:8%; width:36%; max-width:560px;
      left:-30%;
      z-index:36;
      cursor:pointer;
      transition:left .6s cubic-bezier(.22,.68,0,1.01), width .6s cubic-bezier(.22,.68,0,1.01), max-width .6s cubic-bezier(.22,.68,0,1.01), top .6s cubic-bezier(.22,.68,0,1.01);
    }
    .status-open .status-card{ left:24%; width:52%; max-width:820px; top:9%; cursor:default; }
    .status-card-bg{ width:100%; display:block; pointer-events:none; }

    .status-card-close{
      position:absolute; top:4%; right:5%;
      width:30px; height:30px; border-radius:50%;
      border:none; background:rgba(255,255,255,.18); color:#fff;
      font-size:18px; line-height:1; cursor:pointer;
      opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-card-close:hover{ background:rgba(255,255,255,.3); }
    .status-open .status-card-close{ opacity:1; pointer-events:auto; transition:opacity .35s ease .35s; }

    .status-rows{
      position:absolute; left:17%; right:19%; top:20%; bottom:15%;
      display:flex; flex-direction:column; justify-content:space-evenly; gap:6px;
      opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-open .status-rows{ opacity:1; pointer-events:auto; transition:opacity .4s ease .35s; }
    .status-row{ display:flex; align-items:center; gap:14px; }
    .status-row-icon{ width:36px; height:36px; object-fit:contain; flex-shrink:0; }
    .status-row-body{ flex:1; min-width:0; }
    .status-row-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .status-row-name{ font-size:12px; font-weight:700; color:#fff0ec; letter-spacing:.3px; }
    .status-percent{ font-size:12px; font-weight:800; color:#fff; min-width:34px; text-align:right; }
    .status-bar-track{ width:100%; height:10px; border-radius:999px; background:rgba(255,255,255,.28); overflow:hidden; }
    .status-bar-fill{ height:100%; border-radius:999px; transition:width .4s ease, background .3s ease; }

    .status-total{ font-size:12px; font-weight:800; text-align:right; letter-spacing:.3px; margin-top:2px; }

    .status-check-btn{
      position:absolute; left:50%; top:62%; width:16%;
      z-index:32;
      border:none; cursor:pointer; padding:0; background:transparent;
      opacity:0; pointer-events:none;
      transform:translateX(-50%) translateY(24px) scale(.94);
      transition:filter .16s ease, opacity .4s cubic-bezier(.22,.68,0,1.01) .1s, transform .4s cubic-bezier(.22,.68,0,1.01) .1s;
    }
    .status-open .status-check-btn{
      opacity:1; pointer-events:auto;
      transform:translateX(-50%) translateY(0) scale(1);
    }
    .status-check-btn img{ width:100%; display:block; }
    .status-check-label{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:1.6vw; letter-spacing:.08vw;
      color:#fffaf0;
      text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
      transform:translateY(-14%);
      transition:text-shadow .12s ease;
    }

    /* ---------- Solid dark-green "pressable" shadow + press animation on all action buttons ---------- */
    .transfer-btn,
    .status-check-btn{
      filter:drop-shadow(0 5px 0 #14361f);
      transition:transform .12s ease, filter .16s ease;
    }
    .transfer-btn:hover{ filter:brightness(1.06) drop-shadow(0 5px 0 #14361f); }
    .status-check-btn:hover{ filter:brightness(1.06) drop-shadow(0 5px 0 #14361f); }
    .transfer-btn:active{ filter:brightness(.94) drop-shadow(0 2px 0 #14361f); }
    .status-check-btn:active{ filter:brightness(.94) drop-shadow(0 2px 0 #14361f); }

    .transfer-btn img,
    .status-check-btn img{
      filter:brightness(1.1) saturate(1.05);
    }

    .submit-btn,
    .type-btn,
    .add-member-btn,
    .remove-member-btn,
    .faction-btn{
      box-shadow:0 5px 0 #14361f;
      transition:transform .12s ease, box-shadow .12s ease, background .2s ease, color .2s ease, border-color .2s ease;
    }
    .submit-btn:active,
    .type-btn:active,
    .add-member-btn:active,
    .remove-member-btn:active,
    .faction-btn:active{
      transform:scale(.97);
      box-shadow:0 2px 0 #14361f;
    }
    .transfer-btn:active .btn-label,
    .status-check-btn:active .status-check-label{
      text-shadow:none;
    }
    .transfer-btn:active{ transform:translateX(-50%) translateY(0) scale(.97); }
    .status-open .transfer-btn:active{ transform:translateX(-50%) translateY(60px) scale(.93) !important; }
    .status-check-btn:active{ transform:translateX(-50%) translateY(0) scale(.97); }

    /* ================= MODAL ================= */
    .modal-overlay{
      position:fixed; inset:0; background:rgba(20,20,30,.45);
      z-index:100; display:none; align-items:center; justify-content:center;
      padding:20px;
    }
    .modal-overlay.visible{ display:flex; }
    .modal-box{
      background:#fff; border-radius:18px; width:100%; max-width:440px;
      max-height:88vh; overflow-y:auto;
      padding:28px 26px; position:relative;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      animation: modalIn .35s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes modalIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
    .modal-close{
      position:absolute; top:14px; right:14px;
      background:none; border:none; font-size:22px; color:#999; cursor:pointer;
      width:32px; height:32px; border-radius:8px;
    }
    .modal-close:hover{ background:#f4f5fa; color:#333; }
    .modal-box h2{ font-size:20px; font-weight:800; color:#1a1a2e; margin-bottom:6px; }
    .modal-sub{ font-size:13px; color:#888; margin-bottom:20px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .field input, .field textarea, .field select{
      padding:12px 14px; border-radius:10px; border:1.5px solid #e3e3ec;
      font-size:14px; font-family:inherit; outline:none; transition:border-color .2s ease;
      resize:vertical; background:#fff;
    }
    .field input:focus, .field textarea:focus, .field select:focus{ border-color:#3B5BDB; }
    .form-error{
      background:#fff0f0; color:#e03131; border:1px solid #ffd6d6;
      border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;
      display:none; margin-bottom:14px;
    }
    .form-error.visible{ display:block; }
    .form-success{
      background:#f0fff4; color:#2b8a3e; border:1px solid #d3f9d8;
      border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;
      display:none; margin-bottom:14px;
    }
    .form-success.visible{ display:block; }
    .submit-btn{
      width:100%; background:#f2a90f; color:#fff; border:none; border-radius:12px;
      padding:14px; font-weight:800; font-size:15px; letter-spacing:.4px; cursor:pointer;
    }
    .submit-btn:active{ transform:translateY(3px) scale(.97); }
    .submit-btn:disabled{ opacity:.7; cursor:default; }

    /* ---------- Solo / Group toggle ---------- */
    .transfer-type-toggle{
      display:flex; border:1.5px solid #e3e3ec; border-radius:12px; overflow:hidden; margin-bottom:20px;
    }
    .type-btn{
      flex:1; padding:13px 8px; border:none; background:#f4f5fa; color:#666;
      font-weight:700; font-size:12.5px; letter-spacing:.2px; cursor:pointer;
    }
    .type-btn.active{ background:#fff; color:#f2a90f; }
    .type-btn + .type-btn{ border-left:1.5px solid #e3e3ec; }

    /* ---------- Alliance tag (group only) ---------- */
    #group-alliance-field{ display:none; }

    /* ---------- Member rows ---------- */
    .member-row{
      border:1.5px solid #eef0f7; border-radius:14px; padding:16px 16px 4px 16px;
      margin-bottom:16px; background:#fafbff;
    }
    .member-row-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .member-row-header span{ font-size:11px; font-weight:800; color:#999; letter-spacing:.5px; }
    .remove-member-btn{
      background:none; border:1.5px solid #e03131; color:#e03131; border-radius:8px;
      padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer;
    }
    .remove-member-btn:hover{ background:#fff0f0; }

    .field-row{ display:flex; gap:12px; }
    .field-row .field{ flex:1; min-width:0; }

    .faction-role-row{ align-items:flex-end; }
    .faction-picker{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .faction-picker label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .faction-btn{
      width:44px; height:44px; border-radius:50%; border:2px solid #d8dae6; background:#e9eaf2;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    .faction-btn .faction-letter{ font-weight:800; font-size:14px; color:#fff; }
    .faction-btn[data-state="0"]{ background:#e9eaf2; border-color:#d8dae6; }
    .faction-btn[data-state="1"]{ background:#3b82f6; border-color:#3b82f6; } /* F - blue */
    .faction-btn[data-state="2"]{ background:#8b5cf6; border-color:#8b5cf6; } /* S - purple */
    .faction-btn[data-state="3"]{ background:#f2a90f; border-color:#f2a90f; } /* R - orange */

    .add-member-btn{
      display:none; width:100%; border:1.5px dashed #d8dae6; background:transparent;
      border-radius:12px; padding:12px; font-weight:700; font-size:13px; color:#666;
      cursor:pointer; margin-bottom:18px;
    }
    .add-member-btn:hover{ border-color:#3B5BDB; color:#3B5BDB; }

    /* ---------- UID status lookup result ---------- */
    .uid-lookup-result{
      display:none; margin-top:2px; padding:14px 16px; border-radius:12px;
      font-weight:800; font-size:14px; text-align:center; letter-spacing:.4px;
    }
    .uid-lookup-result.visible{ display:block; }
    .uid-lookup-result.status-pending{ background:#fff8e6; color:#b8860b; border:1px solid #ffe6a3; }
    .uid-lookup-result.status-approved{ background:#f0fff4; color:#2b8a3e; border:1px solid #d3f9d8; }
    .uid-lookup-result.status-rejected{ background:#fff0f0; color:#e03131; border:1px solid #ffd6d6; }

    @media (max-width:760px){
      .scene{ width:max(100vw, 105vh); }

      .status-open .header-ribbon{
        opacity:1 !important;
        transform:translate(-50%, 0) !important;
      }

      .transfer-btn .btn-label{ font-size:3.4vw; }

    (function () {

      if (!img) return

      function applySidebarWidth() {
        if (!img.naturalWidth || !img.naturalHeight) return
        var ratio = img.naturalWidth / img.naturalHeight
        var w = Math.round(window.innerHeight * ratio)
        document.documentElement.style.setProperty('--sidebar-w', w + 'px')

    async function loadWingStatus() {
      try {
        if (!supabaseClient) { console.error('loadWingStatus skipped: no supabase client'); return }

        var configRes = await supabaseClient.from('wing_config').select('color, min_score, seat_capacity')
        if (configRes.error) throw configRes.error
        var configRows = configRes.data || []

        var membersRes = await supabaseClient.from('migration_members').select('assigned_wing, status')
        if (membersRes.error) throw membersRes.error
        var liveCounts = {}
        ;(membersRes.data || []).forEach(function (m) {
          if (!m.assigned_wing || m.status !== 'approved') return
          liveCounts[m.assigned_wing] = (liveCounts[m.assigned_wing] || 0) + 1
        })

        var overrideRes = await supabaseClient.from('wing_status').select('color, percentage')
        if (overrideRes.error) console.error('wing_status lookup failed', overrideRes.error)
        var overrides = {}
        ;((overrideRes && overrideRes.data) || []).forEach(function (r) {
          if (r.percentage != null) overrides[r.color] = r.percentage
        })

        var capacityByColor = {}
        configRows.forEach(function (r) { capacityByColor[r.color] = r.seat_capacity })

        var knownColors = configRows.length ? configRows.map(function (r) { return r.color }) : WING_ORDER_FALLBACK
        var order = WING_ORDER_FALLBACK.filter(function (c) { return knownColors.indexOf(c) !== -1 })
        knownColors.forEach(function (c) { if (order.indexOf(c) === -1) order.push(c) })

        statusRows = order.map(function (color) {
          var hasOverride = Object.prototype.hasOwnProperty.call(overrides, color)
          return {
            key: color,
            capacity: capacityByColor[color] != null ? capacityByColor[color] : 100,
            count: hasOverride ? overrides[color] : (liveCounts[color] || 0),
            overridden: hasOverride
          }
        })
        statusRowsLoaded = true
      } catch (e) {
        console.error('loadWingStatus failed', e)
        if (window.showAppError) window.showAppError('WING STATUS LOAD FAILED: ' + ((e && e.message) || 'unknown error'))
      }
    }

    function renderStatusRows() {
      try {
        var container = $('status-rows')
        if (!container) return
        var privileged = isPrivileged()

        var totalCount = statusRows.reduce(function (sum, r) { return sum + (r.count || 0) }, 0)
        var totalCapacity = statusRows.reduce(function (sum, r) { return sum + (r.capacity || 0) }, 0)

        var rowsHtml = statusRows.map(function (row, i) {
          var disp = WING_DISPLAY[row.key] || { labelKey: null, color: '#999', icon: '' }
          var name = t(disp.labelKey, row.key)
          var capacity = row.capacity || 0
          var count = Math.max(0, row.count || 0)
          var pct = capacity > 0 ? Math.max(0, Math.min(100, (count / capacity) * 100)) : 0

          return (
            '<div class="status-row" data-row="' + i + '">' +
              (disp.icon ? '<img class="status-row-icon" src="' + disp.icon + '" alt="' + name + ' icon" onerror="this.style.display=\'none\'" />' : '') +
              '<div class="status-row-body">' +
                '<div class="status-row-top">' +
                  '<span class="status-row-name">' + name + '</span>' +
                  '<span class="status-percent">' + count + '/' + capacity + '</span>' +
                '</div>' +
                '<div class="status-bar-track"><div class="status-bar-fill" style="width:' + pct + '%; background:' + disp.color + ';"></div></div>' +
              '</div>' +
            '</div>'
          )
        }).join('')

        var totalHtml = privileged
          ? '<div class="status-total" style="color:' + (totalCount >= totalCapacity ? '#a3f0b0' : '#ffd9a0') + '">' +
              t('wing_total_label', 'Total') + ': ' + totalCount + '/' + totalCapacity +

          : ''

        container.innerHTML = rowsHtml + totalHtml
      } catch (e) { console.error('renderStatusRows failed', e) }
    }

      async function runUidLookup(){
        if (uidLookupError) uidLookupError.classList.remove('visible')
        if (uidLookupResult) { uidLookupResult.classList.remove('visible','status-pending','status-approved','status-rejected'); uidLookupResult.textContent = '' }

        var uidVal = (uidLookupInput && uidLookupInput.value || '').trim()
        if (!uidVal) {
          if (uidLookupError) {
            uidLookupError.textContent = t('uid_lookup_error_missing', 'Please enter a UID.')
            uidLookupError.classList.add('visible')
          }
          return
        }

        if (!supabaseClient) initSupabase()
        if (!supabaseClient) {
          if (uidLookupError) {
            uidLookupError.textContent = t('form_error_offline', "Can't reach the server right now, so this wasn't saved. Check your connection and try again.")
            uidLookupError.classList.add('visible')
          }
          return
        }

        if (uidLookupSearchBtn) uidLookupSearchBtn.disabled = true
        try {
          var res = await supabaseClient
            .from('migration_members')
            .select('status, created_at')
            .eq('uid', uidVal)
            .order('created_at', { ascending: false })
            .limit(1)

          if (res.error) throw res.error

          var row = (res.data || [])[0]
          if (!row) {
            if (uidLookupError) {
              uidLookupError.textContent = t('uid_lookup_error_notfound', 'No migration request found for this UID.')
              uidLookupError.classList.add('visible')
            }
            return
          }

          var statusKey = (row.status || 'pending').toLowerCase()
          var labelKey = statusKey === 'approved' ? 'status_approved' : (statusKey === 'rejected' ? 'status_rejected' : 'status_pending')
          var cssClass = statusKey === 'approved' ? 'status-approved' : (statusKey === 'rejected' ? 'status-rejected' : 'status-pending')

          if (uidLookupResult) {
            uidLookupResult.textContent = t(labelKey, statusKey.toUpperCase())
            uidLookupResult.classList.add('visible', cssClass)
          }
        } catch (err) {
          if (uidLookupError) {
            uidLookupError.textContent = (err && err.message) || 'Something went wrong.'
            uidLookupError.classList.add('visible')
          }
        } finally {
          if (uidLookupSearchBtn) uidLookupSearchBtn.disabled = false
        }
      }

      on('uid-lookup-search-btn', 'click', runUidLookup)
    } catch (e) { console.error('uid lookup init failed', e) }

          var missing = members.some(function (m) {
            return !m.uid || !m.username || !m.prevAlliance || !m.prevServer ||
                   !m.killcount || !(m.faction > 0) || !m.role || !m.f1Power
          })
          var allianceTagVal = (transferType === 'group' && $('alliance-tag')) ? $('alliance-tag').value.trim() : ''
          if (transferType === 'group' && !allianceTagVal) missing = true

          if (missing) {
            if (errorEl) {
              errorEl.textContent = t('form_error_required', 'Please fill in every field for every member (Migration Score is the only optional one).')
              errorEl.classList.add('visible')
            }
            return
          }

          if (!supabaseClient) {
            initSupabase()
          }
          if (!supabaseClient) {
            if (errorEl) {
              errorEl.textContent = t('form_error_offline', "Can't reach the server right now, so this wasn't saved. Check your connection and try again.")
              errorEl.classList.add('visible')
            }
            return
          }

          if (submitBtn) submitBtn.disabled = true
          try {
            var memberPayload = members.map(function (m) {
              return {
                uid: m.uid,
                username: m.username,
                previous_alliance: m.prevAlliance,
                previous_server: m.prevServer,
                kill_count: m.killcount ? (m.killcount + 'M') : '',
                faction: factionLetter(m.faction || 0),
                role: m.role,
                migration_score: m.migrationScore ? Number(m.migrationScore) : null,
                f1_power: Number(m.f1Power),
                f2_power: m.f2Power ? Number(m.f2Power) : null
              }
            })

            var reqRes = await supabaseClient.from('migration_requests').insert({
              type: transferType,
              alliance_tag: allianceTagVal || null
            }).select().single()

            if (reqRes.error) throw reqRes.error

            var requestId = reqRes.data.id
            var membersRes = await supabaseClient.from('migration_members').insert(
              memberPayload.map(function (m) { return Object.assign({ request_id: requestId }, m) })
            )
            if (membersRes.error) throw membersRes.error

            if (successEl) {
              successEl.textContent = 'Migration request sent!'
              successEl.classList.add('visible')
            }
            setTimeout(closeModal, 1200)
          } catch (err) {
            if (errorEl) {
              errorEl.textContent = (err && err.message) || 'Something went wrong.'
              errorEl.classList.add('visible')
            }
          } finally {
            if (submitBtn) submitBtn.disabled = false
          }
        })
      }

      resetTransferState()
    } catch (e) { console.error('migration modal init failed', e) }
  </script>
</body>
</html>
