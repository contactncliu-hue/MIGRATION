<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOO - Transfer</title>

  <!-- ===== VISIBLE ERROR CATCHER (loads first, before anything else) =====
       On iPad there's no console access, so any JS error that happens
       anywhere on this page will now show up as a red banner at the top
       of the screen instead of silently killing everything. -->
  <script>
    (function () {
      function showError(text) {
        var box = document.createElement('div')
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e03131;color:#fff;' +
          'padding:12px 16px;font-size:13px;font-family:monospace;z-index:999999;' +
          'white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.3);'
        box.textContent = text
        var closeBtn = document.createElement('span')
        closeBtn.textContent = ' ✕'
        closeBtn.style.cssText = 'float:right;cursor:pointer;font-weight:bold;'
        closeBtn.onclick = function () { box.remove() }
        box.appendChild(closeBtn)
        if (document.body) document.body.appendChild(box)
        else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box) })
      }
      window.addEventListener('error', function (e) {
        showError('JS ERROR: ' + e.message + '\n(' + (e.filename || '') + ':' + e.lineno + ':' + e.colno + ')')
      })
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason)
        showError('PROMISE ERROR: ' + reason)
      })
    })()
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; display: flex; min-height: 100vh; background: #f4f5fa; overflow-x:hidden; }

    /* ================= SIDEBAR ================= */
    .sidebar { width: 240px; min-width:240px; background: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; padding: 24px 0; transition:margin-left .35s ease, opacity .35s ease; z-index:70; }
    body.sidebar-hidden .sidebar{ margin-left:-240px; opacity:0; pointer-events:none; }
    .sidebar-backdrop{ display:none; }
    .sidebar .logo-img { width: 70px; margin: 0 auto 20px auto; display: block; }
    .user-block { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px 20px; border-bottom: 1px solid #eee; margin-bottom: 12px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #3B5BDB; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .user-info .user-name { font-weight: 700; font-size: 14px; color: #1a1a2e; }
    .user-info .user-role { font-size: 12px; color: #888; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 14px 20px; color: #444; text-decoration: none; font-weight: 600; font-size: 14px; cursor: pointer; letter-spacing: 0.3px; }
    .nav-link:hover { background: #f4f5fa; }
    .nav-link.active { background: #3B5BDB; color: white; }
    .sidebar-bottom { margin-top: auto; padding: 16px 20px 0 20px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-bottom label { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 0.5px; }
    .lang-select { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; font-weight: 600; cursor: pointer; }
    .logout-btn { background: none; border: 1.5px solid #e03131; color: #e03131; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #fff0f0; }

    .menu-toggle{
      position:fixed; top:24px; right:32px; z-index:80;
      width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
      background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    }
    .menu-toggle span{ width:22px; height:3px; border-radius:2px; background:#3B5BDB; display:block; transition:transform .25s ease, opacity .25s ease; }
    body.sidebar-hidden .menu-toggle span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
    body.sidebar-hidden .menu-toggle span:nth-child(2){ opacity:0; }
    body.sidebar-hidden .menu-toggle span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

    @media (max-width:760px){
      .sidebar{ position:fixed; inset:0 auto 0 0; }
      .sidebar-backdrop{
        display:none; position:fixed; inset:0; background:rgba(20,20,30,.4); z-index:65;
      }
      body:not(.sidebar-hidden) .sidebar-backdrop{ display:block; }
    }

    /* ================= MAIN / HERO STAGE ================= */
    .main-content { flex: 1; position:relative; overflow:hidden; min-height:100vh; }

    .transfer-stage{
      position:relative;
      width:100%; height:100vh;
      overflow:hidden;
      background:linear-gradient(160deg, #fff6e0 0%, #fdf3da 22%, #eef4e4 55%, #ffffff 100%);
    }

    /* This fixed-aspect-ratio canvas is the actual fix. It matches the
       ~2560x1451 proportions of your reference design, and is sized with
       max(100vw, 100vh * ratio) -- the same math CSS background-size:cover
       uses -- so it always fully covers the viewport with no gaps, cropping
       evenly instead of stretching. Every decorative layer below is
       positioned as a percentage of THIS box, not of the viewport and not
       of each other, so they can no longer drift out of proportion with
       each other the way they were before. */
    .scene{
      position:absolute; left:50%; bottom:0;
      width:max(100vw, 177.7vh);
      aspect-ratio:2560/1451;
      transform:translateX(-50%);
      opacity:0;
      transition:opacity 1.4s ease;
    }
    .stage-ready .scene{ opacity:1; }

    .deco-bg{
      position:absolute; inset:0;
      pointer-events:none;
    }
    .deco-bg img{ width:100%; height:100%; display:block; object-fit:fill; }

    /* Arch/scroll is now anchored to the BOTTOM of the scene instead of a
       "top" percentage. With "top", the arch's vertical position drifted
       depending on the scene's overall height (viewport ratio), which is
       why it kept landing too low. Anchoring from the bottom "magnetizes"
       the base of the arch to the bottom edge of the scene every time,
       regardless of viewport size, matching the reference art where the
       scroll's base sits right at the bottom of the frame. */
    .arch-card{
      position:absolute; left:32%; bottom:0; width:36%;
      z-index:5;
      opacity:0;
      transform:translateY(90px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .2s, opacity 1.6s ease .2s;
    }
    .stage-ready .arch-card{ opacity:1; transform:translateY(0); }
    .arch-bg{ width:100%; display:block; pointer-events:none; }

    .header-ribbon{
      position:absolute; left:50%; top:11%; width:100%;
      z-index:8;
      pointer-events:none;
      overflow:hidden;
      opacity:0;
      transform:translate(-50%, 60px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .6s, opacity 1.6s ease .6s;
    }
    .stage-ready .header-ribbon{ opacity:1; transform:translate(-50%, 0); }
    /* clip-path trims a thin sliver off the bottom of the source PNG --
       that's the hard edge/box you were seeing under the clouds. It's
       baked into the asset itself, not a CSS position issue, so cropping
       it is the only way to remove it without re-exporting the image. */
    .header-ribbon img{ width:100%; display:block; clip-path:inset(0 0 4% 0); }

    .bottom-fade{
      position:absolute; left:0; right:0; bottom:0; height:10%;
      background:linear-gradient(to bottom, rgba(253,243,218,0) 0%, rgba(253,243,218,.9) 65%, #fdf3da 100%);
      z-index:20; pointer-events:none;
    }

    .transfer-btn{
      position:absolute; left:50%; top:62%; width:26%;
      z-index:30;
      border:none; cursor:pointer; padding:0;
      background:transparent;
      opacity:0;
      transform:translateX(-50%) translateY(40px) scale(.94);
      transition:filter .2s ease, opacity 1.6s cubic-bezier(.22,.68,0,1.01) 1.1s, transform 1.6s cubic-bezier(.22,.68,0,1.01) 1.1s;
    }
    .stage-ready .transfer-btn{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    .transfer-btn:hover{ filter:brightness(1.06); }
    .transfer-btn:active{ filter:brightness(.94); }
    .transfer-btn img{ width:100%; display:block; }
    .transfer-btn .btn-label{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:1.6vw; letter-spacing:.08vw;
      color:#fffaf0;
      text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
    }

    /* When the status card is open, the header ribbon and the transfer
       button pan slowly DOWN out of the way (instead of a quick fade/lift)
       so the transition itself is visible -- the status card takes over
       that same visual "slot" in the scene once they've cleared it. */
    .status-open .header-ribbon,
    .status-open .transfer-btn{
      opacity:0 !important;
      transform:translate(-50%, 60px) !important;
      pointer-events:none;
      transition:transform 1.4s cubic-bezier(.22,.68,0,1.01), opacity 1s ease;
    }
    .status-open .transfer-btn{ transform:translateX(-50%) translateY(60px) scale(.96) !important; }

    /* Fallback color ONLY kicks in if the real image actually fails to
       load (see the 'img-failed' class added by onerror below) -- it no
       longer shows by default, which is what caused the solid white/
       orange boxes bleeding through the transparent parts of the real
       artwork. */
    .arch-card.img-failed { background:#fff8ea; border-radius:24px; aspect-ratio:3/4; }
    .transfer-btn.img-failed { background:#f2a90f; border-radius:14px; aspect-ratio:5/1; }

    /* ================= STATUS CARD =================
       ONE element, ONE asset (assets/transfer-status-card.PNG) for both
       states -- it's the same card, just slid off to the left by default
       (only a sliver shows, like your reference) and slid to center + made
       LARGER when clicked. No separate "tab" graphic needed.
       IMPORTANT: this lives outside .scene (see the HTML comment above it)
       so these percentages are relative to the real viewport-sized
       .transfer-stage, not the oversized/clipped .scene canvas. */
    .status-card{
      position:absolute; top:8%; width:36%; max-width:560px;
      left:-30%; /* only a sliver of the card's own edge peeks past the real screen edge */
      z-index:36;
      cursor:pointer;
      transition:left .6s cubic-bezier(.22,.68,0,1.01), width .6s cubic-bezier(.22,.68,0,1.01), max-width .6s cubic-bezier(.22,.68,0,1.01), top .6s cubic-bezier(.22,.68,0,1.01);
    }
    /* Bigger + centered once opened. (100% - 52%) / 2 = 24% for centering. */
    .status-open .status-card{ left:24%; width:52%; max-width:820px; top:9%; cursor:default; }
    .status-card-bg{ width:100%; display:block; pointer-events:none; }

    .status-card-close{
      position:absolute; top:4%; right:5%;
      width:30px; height:30px; border-radius:50%;
      border:none; background:rgba(255,255,255,.18); color:#fff;
      font-size:18px; line-height:1; cursor:pointer;
      opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-card-close:hover{ background:rgba(255,255,255,.3); }
    .status-open .status-card-close{ opacity:1; pointer-events:auto; transition:opacity .35s ease .35s; }

    /* Positioned to sit over the 4 armchair icons already baked into your
       PNG art -- adjust the top/bottom/left insets below to match wherever
       your icons actually land once you drop the real file in.
       Hidden (opacity 0, not just visually covered) whenever the card is
       collapsed, so none of this text/bars can peek out of the sliver --
       that's what was showing through in the "before" screenshot. */
    .status-rows{
      position:absolute; left:17%; right:19%; top:17%; bottom:17%;
      display:flex; flex-direction:column; justify-content:space-between;
      opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-open .status-rows{ opacity:1; pointer-events:auto; transition:opacity .4s ease .35s; }
    .status-row{ display:flex; align-items:center; gap:14px; }
    .status-row-icon{ width:40px; height:40px; object-fit:contain; flex-shrink:0; }
    .status-row-body{ flex:1; min-width:0; }
    .status-row-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .status-row-name{ font-size:12px; font-weight:700; color:#fff0ec; letter-spacing:.3px; }
    .status-percent{ font-size:12px; font-weight:800; color:#fff; min-width:34px; text-align:right; }
    .status-bar-track{ width:100%; height:10px; border-radius:999px; background:rgba(255,255,255,.28); overflow:hidden; }
    .status-bar-fill{ height:100%; border-radius:999px; transition:width .4s ease, background .3s ease; }

    /* Admin-only inline editor, hidden unless the logged-in user's role is ADMIN */
    .status-admin{ display:flex; align-items:center; gap:6px; margin-top:5px; }
    .status-admin input{
      width:40px; padding:2px 5px; border-radius:6px; border:1px solid rgba(255,255,255,.5);
      background:rgba(255,255,255,.9);
      font-size:11px; font-weight:700; text-align:center;
    }
    .status-admin span{ font-size:10px; color:#ffe3de; font-weight:600; }
    .status-total{ font-size:12px; font-weight:800; text-align:right; letter-spacing:.3px; margin-top:4px; }

    /* assets/transfer-status-button.PNG -- moved OUT of the card and given
       the exact same font styling as .transfer-btn (per your request), just
       smaller, and anchored to the same vertical "slot" on the arch
       (top:62%, same as .transfer-btn) so it visually replaces it once the
       transfer button pans away. Only visible while the card is open. */
    .status-check-btn{
      position:absolute; left:50%; top:62%; width:16%;
      z-index:32;
      border:none; cursor:pointer; padding:0; background:transparent;
      opacity:0; pointer-events:none;
      transform:translateX(-50%) translateY(24px) scale(.94);
      transition:filter .2s ease, opacity 1s cubic-bezier(.22,.68,0,1.01) .5s, transform 1s cubic-bezier(.22,.68,0,1.01) .5s;
    }
    .status-open .status-check-btn{
      opacity:1; pointer-events:auto;
      transform:translateX(-50%) translateY(0) scale(1);
    }
    .status-check-btn img{ width:100%; display:block; }
    .status-check-btn:hover{ filter:brightness(1.06); }
    .status-check-btn:active{ filter:brightness(.94); }
    .status-check-label{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:1.6vw; letter-spacing:.08vw;
      color:#fffaf0;
      text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
    }

    /* ================= MODAL ================= */
    .modal-overlay{
      position:fixed; inset:0; background:rgba(20,20,30,.45);
      z-index:100; display:none; align-items:center; justify-content:center;
      padding:20px;
    }
    .modal-overlay.visible{ display:flex; }
    .modal-box{
      background:#fff; border-radius:18px; width:100%; max-width:440px;
      max-height:88vh; overflow-y:auto;
      padding:28px 26px; position:relative;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      animation: modalIn .35s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes modalIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
    .modal-close{
      position:absolute; top:14px; right:14px;
      background:none; border:none; font-size:22px; color:#999; cursor:pointer;
      width:32px; height:32px; border-radius:8px;
    }
    .modal-close:hover{ background:#f4f5fa; color:#333; }
    .modal-box h2{ font-size:20px; font-weight:800; color:#1a1a2e; margin-bottom:6px; }
    .modal-sub{ font-size:13px; color:#888; margin-bottom:20px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .field input, .field textarea, .field select{
      padding:12px 14px; border-radius:10px; border:1.5px solid #e3e3ec;
      font-size:14px; font-family:inherit; outline:none; transition:border-color .2s ease;
      resize:vertical; background:#fff;
    }
    .field input:focus, .field textarea:focus, .field select:focus{ border-color:#3B5BDB; }
    .form-error{
      background:#fff0f0; color:#e03131; border:1px solid #ffd6d6;
      border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;
      display:none; margin-bottom:14px;
    }
    .form-error.visible{ display:block; }
    .form-success{
      background:#f0fff4; color:#2b8a3e; border:1px solid #d3f9d8;
      border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;
      display:none; margin-bottom:14px;
    }
    .form-success.visible{ display:block; }
    .submit-btn{
      width:100%; background:#f2a90f; color:#fff; border:none; border-radius:12px;
      padding:14px; font-weight:800; font-size:15px; letter-spacing:.4px; cursor:pointer;
      box-shadow:0 5px 0 #c98c0c; transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
    }
    .submit-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #c98c0c; }
    .submit-btn:disabled{ opacity:.7; cursor:default; }

    /* ---------- Solo / Group toggle ---------- */
    .transfer-type-toggle{
      display:flex; border:1.5px solid #e3e3ec; border-radius:12px; overflow:hidden; margin-bottom:20px;
    }
    .type-btn{
      flex:1; padding:13px 8px; border:none; background:#f4f5fa; color:#666;
      font-weight:700; font-size:12.5px; letter-spacing:.2px; cursor:pointer;
      transition:background .2s ease, color .2s ease;
    }
    .type-btn.active{ background:#fff; color:#f2a90f; }
    .type-btn + .type-btn{ border-left:1.5px solid #e3e3ec; }

    /* ---------- Alliance tag (group only) ---------- */
    #group-alliance-field{ display:none; }

    /* ---------- Member rows ---------- */
    .member-row{
      border:1.5px solid #eef0f7; border-radius:14px; padding:16px 16px 4px 16px;
      margin-bottom:16px; background:#fafbff;
    }
    .member-row-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .member-row-header span{ font-size:11px; font-weight:800; color:#999; letter-spacing:.5px; }
    .remove-member-btn{
      background:none; border:1.5px solid #e03131; color:#e03131; border-radius:8px;
      padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer;
    }
    .remove-member-btn:hover{ background:#fff0f0; }

    .field-row{ display:flex; gap:12px; }
    .field-row .field{ flex:1; min-width:0; }

    .faction-role-row{ align-items:flex-end; }
    .faction-picker{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .faction-picker label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .faction-btn{
      width:44px; height:44px; border-radius:50%; border:2px solid #d8dae6; background:#e9eaf2;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      transition:background .2s ease, border-color .2s ease, transform .15s ease;
    }
    .faction-btn:active{ transform:scale(.92); }
    .faction-btn .faction-letter{ font-weight:800; font-size:14px; color:#fff; }
    .faction-btn[data-state="0"]{ background:#e9eaf2; border-color:#d8dae6; }
    .faction-btn[data-state="1"]{ background:#3b82f6; border-color:#3b82f6; } /* F - blue */
    .faction-btn[data-state="2"]{ background:#8b5cf6; border-color:#8b5cf6; } /* S - purple */
    .faction-btn[data-state="3"]{ background:#f2a90f; border-color:#f2a90f; } /* R - orange */

    .add-member-btn{
      display:none; width:100%; border:1.5px dashed #d8dae6; background:transparent;
      border-radius:12px; padding:12px; font-weight:700; font-size:13px; color:#666;
      cursor:pointer; margin-bottom:18px; transition:border-color .2s ease, color .2s ease;
    }
    .add-member-btn:hover{ border-color:#3B5BDB; color:#3B5BDB; }

    @media (max-width:760px){
      .transfer-btn .btn-label{ font-size:3.4vw; }
      .status-check-label{ font-size:3.4vw; }
      .status-check-btn{ width:34%; }
      .status-card{ width:78%; top:6%; left:-70%; }
      .status-open .status-card{ left:11%; width:78%; max-width:none; } /* (100 - 78) / 2 */
      .status-row-name, .status-percent{ font-size:11px; }
      .field-row{ flex-direction:column; gap:0; }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar">
    <img src="assets/logo.png.PNG" alt="Logo" class="logo-img" onerror="this.style.display='none'" />

    <div class="user-block">
      <div class="user-avatar" id="user-initial">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Loading...</div>
        <div class="user-role" data-i18n="role_label">Role: <span id="user-role">MEMBER</span></div>
      </div>
    </div>

    <a href="index.html" class="nav-link" data-i18n="nav_home">HOMEPAGE</a>
    <a href="transfer.html" class="nav-link active" data-i18n="nav_transfer">TRANSFER</a>
    <a href="admin.html" class="nav-link" id="nav-admin-link" data-i18n="nav_admin" style="display:none;">ADMIN &amp; MANAGEMENT</a>

    <div class="sidebar-bottom">
      <label data-i18n="lang_label">LANGUAGE</label>
      <select class="lang-select" id="lang-select">
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="pt-BR">🇧🇷 Português (BR)</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh-CN">🇨🇳 中文（简体）</option>
      </select>
      <button class="logout-btn" id="logout-btn" data-i18n="logout">LOG OUT</button>
    </div>
  </aside>

  <main class="main-content">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>

    <div class="transfer-stage">

      <div class="scene">
        <div class="deco-bg">
          <img src="assets/transfer-bg-deco.PNG" alt="" onerror="this.style.display='none'" />
        </div>

        <div class="arch-card">
          <img class="arch-bg" src="assets/transfer-arch.PNG" alt="" onerror="this.style.display='none'; this.closest('.arch-card').classList.add('img-failed')" />
        </div>

        <div class="header-ribbon">
          <img src="assets/transfer-header.PNG" alt="" onerror="this.style.display='none'" />
        </div>

        <div class="bottom-fade"></div>

        <button class="transfer-btn" id="open-transfer-btn">

           background canvas (width:max(100vw, 177.7vh)) that's centered and

           off-screen, so percentage positions inside it don't correspond to
           the visible edge of the browser window. This card needs to peek
           from the ACTUAL left edge of the screen, so it's positioned
           relative to .transfer-stage (the real, viewport-sized box) instead.

           inner content hidden -- see .status-rows opacity rules above), and

    // last time and the animation just wouldn't play again).
    try {

        var stage = document.querySelector('.transfer-stage')
        if (!stage) return
        stage.classList.remove('stage-ready')
        // Force a reflow so removing the class actually takes effect before
        // we add it back -- otherwise the browser can coalesce both class
        // changes into one frame and skip the transition entirely.
        void stage.offsetWidth
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            stage.classList.add('stage-ready')
          })
        })
      }

      window.addEventListener('pageshow', function (e) {

    var currentLang = 'en'

    // t(key, fallback) -- used by the dynamically-rendered member rows below,
    // since those get rebuilt from scratch (innerHTML) rather than sitting
    // still with data-i18n attributes for applyTranslations() to find.
    function t(key, fallback) {
      return (translations[currentLang] && translations[currentLang][key]) || fallback
    }

    function applyTranslations() {
      try {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n')
          if (key === 'role_label') return
          if (translations[currentLang] && translations[currentLang][key]) el.innerHTML = translations[currentLang][key]
        })
        var roleEl = document.querySelector('[data-i18n="role_label"]')
        if (roleEl && roleEl.childNodes[0] && translations[currentLang]) {
          roleEl.childNodes[0].textContent = translations[currentLang]['role_label']
        }
      } catch (e) { console.error('applyTranslations failed', e) }
    }

    on('lang-select', 'change', function (e) {
      currentLang = e.target.value
      try { localStorage.setItem('zoo_lang', currentLang) } catch (err) { console.error('localStorage write failed', err) }
      applyTranslations()
      // Re-render any dynamic modal content so it picks up the new language too.
      try { renderMembers() } catch (err) { console.error('re-render on lang change failed', err) }
    })

    applyTranslations()

    // "value/100". The bar itself is always drawn in the row's own team

    // red, BLUE always looks blue, etc.

    // one per wing -- each is a real <img> in its row (rendered below) so it

      { key: 'PURPLE', labelKey: 'wing_purple', value: 50, color: '#8b5cf6', icon: 'https://nlqzanjivjfkftvazrvi.supabase.co/storage/v1/object/sign/assets/IMG_7772.png?token=eyJraWQiOiI5NmIyZWE5MC0yYjdiLTQ5MTktYmY3NC1kMGE4YTQzYjU1ZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJhc3NldHMvSU1HXzc3NzIucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODc3MzkxMCwiZXhwIjoxODIwMzA5OTEwfQ.OaTGQLieD6dNqdyWw08E6Qt9iN1jX9FVOjCGP3uK4SVpLRmqGj5QealsdDuWQs7z_THagYgriNgtCyZLVPkgFQ' },

    // Role assignment itself stays admin-only (enforced separately in admin.html).
    function isPrivileged() {
      var role = (window.zooUserRole || '').toUpperCase()
      return role === 'ADMIN' || role === 'MANAGEMENT'
    }

    // The nav link is just a convenience -- the real gate is server-side
    // RLS on admin.html's own queries, so hiding this link is only about
    // not showing a dead-end link to people who can't use it, not security.
    function updateAdminNavVisibility() {
      var link = $('nav-admin-link')
      if (link) link.style.display = isPrivileged() ? 'flex' : 'none'
    }

    var wingSaveTimer = null
    function scheduleWingSave(row) {
      // Debounced auto-save: fires ~600ms after the admin/management user
      // stops typing, instead of hitting Supabase on every keystroke.
      clearTimeout(wingSaveTimer)
      wingSaveTimer = setTimeout(function () {
        if (!supabase) return
        supabase.from('wing_status')
          .upsert({ color: row.key, percentage: row.value, updated_by: window.zooUserId || null })
          .then(function (res) {
            if (res && res.error) console.error('wing_status save failed', res.error)
          })
      }, 600)
    }

    function renderStatusRows() {
      try {
        var container = $('status-rows')
        if (!container) return
        var privileged = isPrivileged()
        var total = statusRows.reduce(function (sum, r) { return sum + (Math.max(0, Math.min(100, r.value)) || 0) }, 0)

        var rowsHtml = statusRows.map(function (row, i) {
          var pct = Math.max(0, Math.min(100, row.value))
          var name = t(row.labelKey, row.key)
          var adminBlock = privileged
            ? '<div class="status-admin">' +
                '<input type="number" min="0" max="100" step="1" value="' + row.value + '" ' +
                  'class="status-admin-input" data-row="' + i + '" aria-label="' + name + ' value out of 100" />' +
                '<span>/100</span>' +
              '</div>'
            : ''

          return (
            '<div class="status-row" data-row="' + i + '">' +
              (row.icon ? '<img class="status-row-icon" src="' + row.icon + '" alt="' + name + ' icon" onerror="this.style.display=\'none\'" />' : '') +
              '<div class="status-row-body">' +
                '<div class="status-row-top">' +
                  '<span class="status-row-name">' + name + '</span>' +
                  '<span class="status-percent">' + pct + '/100</span>' +
                '</div>' +
                '<div class="status-bar-track"><div class="status-bar-fill" style="width:' + pct + '%; background:' + row.color + ';"></div></div>' +
                adminBlock +
              '</div>' +
            '</div>'
          )
        }).join('')

        // Automatic running total -- only shown to admin/management, since
        // it's only actionable for the people who can actually edit the
        // percentages. Flags green at exactly 100, amber otherwise.
        var totalHtml = privileged
          ? '<div class="status-total" style="color:' + (total === 100 ? '#a3f0b0' : '#ffd9a0') + '">' +
              t('wing_total_label', 'Total') + ': ' + total + '/100' +
            '</div>'
          : ''

        container.innerHTML = rowsHtml + totalHtml

        // Wire up admin/management inputs (only present when privileged)
        container.querySelectorAll('.status-admin-input').forEach(function (input) {
          input.addEventListener('input', function () {
            var idx = parseInt(input.getAttribute('data-row'), 10)
            var val = Math.max(0, Math.min(100, parseInt(input.value, 10) || 0))
            statusRows[idx].value = val
            scheduleWingSave(statusRows[idx])
            renderStatusRows()
          })
        })
      } catch (e) { console.error('renderStatusRows failed', e) }
    }

    // ---------- Status card open+close ----------
    // Same element throughout -- clicking it while it's still in its
    // collapsed/sliver position opens it; once open, only the explicit
    // close (x) button or Escape closes it (so clicking the bars/inputs
    // inside doesn't accidentally re-trigger anything).
    try {
      var statusCard = $('status-card')

      function isStatusOpen() {
        return document.querySelector('.transfer-stage').classList.contains('status-open')
      }
      function openStatusCard() {
        document.querySelector('.transfer-stage').classList.add('status-open')
        if (statusCard) statusCard.setAttribute('aria-hidden', 'false')
        renderStatusRows()
      }
      function closeStatusCard() {
        document.querySelector('.transfer-stage').classList.remove('status-open')
        if (statusCard) statusCard.setAttribute('aria-hidden', 'true')
      }

      on('status-card', 'click', function (e) {
        // Don't toggle closed while the admin is mid-edit in a number input
        // (clicking/focusing the input still bubbles up to this handler).
        if (e && e.target && e.target.closest && e.target.closest('.status-admin')) return
        if (isStatusOpen()) {
          closeStatusCard()
        } else {
          openStatusCard()
        }
      })
      // stopPropagation is required: the close (x) button is a CHILD of
      // #status-card, so without this its click bubbled up to the
      // #status-card listener above. That listener saw closeStatusCard()
      // had JUST removed 'status-open', read isStatusOpen() as false, and
      // immediately reopened the card in the same click -- which is why
      // closing only ever seemed to work via a full page refresh.
      on('status-card-close', 'click', function (e) {
        if (e) e.stopPropagation()
        closeStatusCard()
      })

      // The "CHECK STATUS" pill button (now anchored to the arch, outside the
      // card) is a real, clickable action -- it re-pulls the latest values
      // and re-renders the bars.
      // (Swap the body of this for a real Supabase fetch once that table exists.)
      on('status-check-btn', 'click', function () {
        var btn = $('status-check-btn')
        if (btn) { btn.disabled = true; btn.style.opacity = '.7' }
        setTimeout(function () {
          renderStatusRows()
          if (btn) { btn.disabled = false; btn.style.opacity = '1' }
        }, 400)
      })

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeStatusCard()
      })

      renderStatusRows()
    } catch (e) { console.error('status card init failed', e) }

    // ---------- Supabase ----------
    var SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
    var SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
    var supabase = null
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      } else {
        console.error('Supabase failed to load from the CDN -- login check and logout will not fully work until this loads.')
      }
    } catch (e) { console.error('supabase init failed', e) }

    async function loadUser() {
      try {
        if (!supabase) return
        var res = await supabase.auth.getUser()
        var user = res && res.data ? res.data.user : null
        if (!user) {
          window.location.href = "login.html"
          return
        }

        // Same source the homepage uses: read straight off the auth user
        // (metadata / email) so the name always renders even if a
        // 'profiles' row doesn't exist yet or a table query fails --
        // that dependency on 'profiles' alone was why this got stuck on
        // "Loading..." forever whenever that lookup came back empty.
        window.zooUserId = user.id
        var meta = user.user_metadata || {}
        var uname = meta.username || (user.email || 'Member').split('@')[0]
        var role = (meta.role || 'GUEST')
        window.zooUserRole = role
        if ($('user-name')) $('user-name').textContent = uname
        if ($('user-role')) $('user-role').textContent = String(role).toUpperCase()
        if ($('user-initial')) $('user-initial').textContent = uname.charAt(0).toUpperCase()
        updateAdminNavVisibility()
        renderStatusRows()

        // The 'profiles' table is the real source of truth for role
        // (auth user_metadata is just a starting hint) -- upgrade to it,
        // but never block the page on this lookup.
        try {
          var profRes = await supabase.from('profiles').select('display_name, role').eq('id', user.id).single()
          var profile = profRes && profRes.data
          if (profile) {
            if (profile.display_name && $('user-name')) $('user-name').textContent = profile.display_name
            if (profile.role && $('user-role')) $('user-role').textContent = String(profile.role).toUpperCase()
            if (profile.display_name && $('user-initial')) $('user-initial').textContent = profile.display_name.charAt(0).toUpperCase()
            if (profile.role) window.zooUserRole = profile.role
            updateAdminNavVisibility()
            renderStatusRows()
          }
        } catch (profErr) {
          console.error('profiles lookup failed (non-fatal, already showing auth-based name):', profErr)
        }
      } catch (e) {
        console.error('loadUser failed', e)
        if ($('user-name')) $('user-name').textContent = 'Member'
      }
    }
    loadUser()

    on('logout-btn', 'click', async function () {
      try {
        if (supabase) await supabase.auth.signOut()
      } catch (err) {
        console.error('Sign out failed:', err)
      }
      window.location.href = "login.html"
    })

    // =====================================================================
    // ---------- Migration popup: Solo / Group + member rows ----------
    // =====================================================================
    // transferType: 'solo' | 'group'
    // members: array of { uid, username, prevAlliance, prevServer, killcount, faction, role, migrationScore }
    //   faction: 0 = unset/grey, 1 = F (blue), 2 = S (purple), 3 = R (orange) -- cycles on click
    //   role: '' or 'i1'..'i10' (dropdown only, no other options)
    //   migrationScore: the ONLY optional field -- everything else is required before submit.
    var transferType = 'solo'
    var members = []

    function createEmptyMember() {
      return { uid: '', username: '', prevAlliance: '', prevServer: '', killcount: '', faction: 0, role: '', migrationScore: '' }
    }

    function factionLetter(state) {
      if (state === 1) return 'F'
      if (state === 2) return 'S'
      if (state === 3) return 'R'
      return ''
    }

    function roleOptionsHtml(selected) {
      var out = '<option value="">--</option>'
      for (var i = 1; i <= 10; i++) {
        var val = 'i' + i
        out += '<option value="' + val + '"' + (selected === val ? ' selected' : '') + '>' + val + '</option>'
      }
      return out
    }

    function updateTypeToggleUI() {
      var soloBtn = $('type-solo-btn')
      var groupBtn = $('type-group-btn')
      var allianceField = $('group-alliance-field')
      var addBtn = $('add-member-btn')
      if (soloBtn) soloBtn.classList.toggle('active', transferType === 'solo')
      if (groupBtn) groupBtn.classList.toggle('active', transferType === 'group')
      if (allianceField) allianceField.style.display = (transferType === 'group') ? 'flex' : 'none'
      if (addBtn) addBtn.style.display = (transferType === 'group') ? 'block' : 'none'
    }

    function renderMembers() {
      try {
        var container = $('members-container')
        if (!container) return
        var showHeader = transferType === 'group'
        var canRemove = transferType === 'group' && members.length > 1

        container.innerHTML = members.map(function (m, idx) {
          var removeBtn = canRemove
            ? '<button type="button" class="remove-member-btn" data-action="remove" data-idx="' + idx + '">' + t('remove_member', 'Remove') + '</button>'
            : ''
          var header = showHeader
            ? '<div class="member-row-header"><span>' + t('member_label', 'MEMBER #') + (idx + 1) + '</span>' + removeBtn + '</div>'
            : ''

          return (
            '<div class="member-row" data-idx="' + idx + '">' +
              header +
              '<div class="field">' +
                '<label>' + t('field_uid', 'UID') + '</label>' +
                '<input type="text" class="member-field" data-field="uid" data-idx="' + idx + '" inputmode="numeric" maxlength="13" placeholder="e.g. 1234567890123" value="' + escapeAttr(m.uid) + '" />' +
              '</div>' +
              '<div class="field">' +
                '<label>' + t('field_username', 'Username') + '</label>' +
                '<input type="text" class="member-field" data-field="username" data-idx="' + idx + '" value="' + escapeAttr(m.username) + '" />' +
              '</div>' +
              '<div class="field-row">' +
                '<div class="field">' +
                  '<label>' + t('field_prev_alliance', 'Previous Alliance') + '</label>' +
                  '<input type="text" class="member-field" data-field="prevAlliance" data-idx="' + idx + '" value="' + escapeAttr(m.prevAlliance) + '" />' +
                '</div>' +
                '<div class="field">' +
                  '<label>' + t('field_prev_server', 'Previous Server') + '</label>' +
                  '<input type="text" class="member-field" data-field="prevServer" data-idx="' + idx + '" placeholder="e.g. S1" value="' + escapeAttr(m.prevServer) + '" />' +
                '</div>' +
              '</div>' +
              '<div class="field">' +
                '<label>' + t('field_killcount', 'Kill Count') + '</label>' +
                '<input type="text" class="member-field killcount-field" data-field="killcount" data-idx="' + idx + '" inputmode="numeric" placeholder="e.g. 13" value="' + escapeAttr(m.killcount ? (m.killcount + 'M') : '') + '" />' +
              '</div>' +
              '<div class="field-row faction-role-row">' +
                '<div class="faction-picker">' +
                  '<label>' + t('field_faction', 'Faction') + '</label>' +
                  '<button type="button" class="faction-btn" data-action="faction" data-idx="' + idx + '" data-state="' + (m.faction || 0) + '">' +
                    '<span class="faction-letter">' + factionLetter(m.faction || 0) + '</span>' +
                  '</button>' +
                '</div>' +
                '<div class="field">' +
                  '<label>' + t('field_role', 'Role') + '</label>' +
                  '<select class="member-field role-select" data-field="role" data-idx="' + idx + '">' +
                    roleOptionsHtml(m.role) +
                  '</select>' +
                '</div>' +
              '</div>' +
              '<div class="field">' +
                '<label>' + t('field_migration_score', 'Migration Score (optional)') + '</label>' +
                '<input type="text" class="member-field" data-field="migrationScore" data-idx="' + idx + '" inputmode="numeric" value="' + escapeAttr(m.migrationScore) + '" />' +
              '</div>' +
            '</div>'
          )
        }).join('')

        var addBtn = $('add-member-btn')
        if (addBtn) addBtn.textContent = t('add_member', '+ Add Member')

        updateTypeToggleUI()
      } catch (e) { console.error('renderMembers failed', e) }
    }

    function resetTransferState() {
      transferType = 'solo'
      members = [createEmptyMember()]
      if ($('alliance-tag')) $('alliance-tag').value = ''
      updateTypeToggleUI()
      renderMembers()
    }

    on('type-solo-btn', 'click', function () {
      if (transferType === 'solo') return
      transferType = 'solo'
      members = [members[0] || createEmptyMember()]
      updateTypeToggleUI()
      renderMembers()
    })
    on('type-group-btn', 'click', function () {
      if (transferType === 'group') return
      transferType = 'group'
      if (members.length < 1) members = [createEmptyMember()]
      updateTypeToggleUI()
      renderMembers()
    })

    on('add-member-btn', 'click', function () {
      members.push(createEmptyMember())
      renderMembers()
    })

    // Event delegation on the members container -- rows get rebuilt via
    // innerHTML on every render, so listeners are bound once here instead
    // of being re-attached (and leaking) after each render.
    try {
      var membersContainer = $('members-container')
      if (membersContainer) {
        membersContainer.addEventListener('input', function (e) {
          var target = e.target
          if (!target || !target.classList) return

          if (target.classList.contains('killcount-field')) {
            var kIdx = parseInt(target.getAttribute('data-idx'), 10)
            var digits = target.value.replace(/[^0-9]/g, '')
            members[kIdx].killcount = digits
            target.value = digits ? (digits + 'M') : ''
            return
          }

          if (target.classList.contains('member-field')) {
            var field = target.getAttribute('data-field')
            var idx = parseInt(target.getAttribute('data-idx'), 10)
            if (field === 'uid') {
              var uidVal = target.value.replace(/[^0-9]/g, '').slice(0, 13)
              target.value = uidVal
              members[idx].uid = uidVal
              return
            }
            members[idx][field] = target.value
          }
        })

        membersContainer.addEventListener('change', function (e) {
          var target = e.target
          if (target && target.classList && target.classList.contains('role-select')) {
            var idx = parseInt(target.getAttribute('data-idx'), 10)
            members[idx].role = target.value
          }
        })

        membersContainer.addEventListener('click', function (e) {
          var factionBtn = e.target.closest && e.target.closest('.faction-btn')
          if (factionBtn) {
            var fIdx = parseInt(factionBtn.getAttribute('data-idx'), 10)
            members[fIdx].faction = ((members[fIdx].faction || 0) + 1) % 4
            renderMembers()
            return
          }
          var removeBtn = e.target.closest && e.target.closest('[data-action="remove"]')
          if (removeBtn) {
            var rIdx = parseInt(removeBtn.getAttribute('data-idx'), 10)
            members.splice(rIdx, 1)
            renderMembers()
          }
        })
      }
    } catch (e) { console.error('members container listeners failed', e) }

    // ---------- Migration popup open/close ----------
    try {
      var overlay = $('transfer-modal-overlay')
      var form = $('transfer-form')
      var errorEl = $('transfer-error')
      var successEl = $('transfer-success')
      var submitBtn = $('transfer-submit-btn')

      function openModal(){
        resetTransferState()
        if (overlay) overlay.classList.add('visible')
        if (errorEl) errorEl.classList.remove('visible')
        if (successEl) successEl.classList.remove('visible')
        if (submitBtn) submitBtn.disabled = false
      }
      function closeModal(){ if (overlay) overlay.classList.remove('visible') }

      on('open-transfer-btn', 'click', openModal)
      on('modal-close-btn', 'click', closeModal)
      if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal() })
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay && overlay.classList.contains('visible')) closeModal() })

      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault()
          if (errorEl) errorEl.classList.remove('visible')
          if (successEl) successEl.classList.remove('visible')

          // Every field is required except Migration Score. For group
          // transfers the Alliance Tag is also required.
          var missing = members.some(function (m) {
            return !m.uid || !m.username || !m.prevAlliance || !m.prevServer ||
                   !m.killcount || !(m.faction > 0) || !m.role
          })
          var allianceTagVal = (transferType === 'group' && $('alliance-tag')) ? $('alliance-tag').value.trim() : ''
          if (transferType === 'group' && !allianceTagVal) missing = true

          if (missing) {
            if (errorEl) {
              errorEl.textContent = t('form_error_required', 'Please fill in every field for every member (Migration Score is the only optional one).')
              errorEl.classList.add('visible')
            }
            return
          }

          if (submitBtn) submitBtn.disabled = true
          try {
            var memberPayload = members.map(function (m) {
              return {
                uid: m.uid,
                username: m.username,
                previous_alliance: m.prevAlliance,
                previous_server: m.prevServer,
                kill_count: m.killcount ? (m.killcount + 'M') : '',
                faction: factionLetter(m.faction || 0),
                role: m.role,
                migration_score: m.migrationScore ? Number(m.migrationScore) : null
              }
            })

            // Persist to Supabase: one row in migration_requests (type +
            // alliance tag), then one row per member in migration_members.
            // See the provided schema.sql for the matching table/RLS setup.
            if (supabase) {
              var reqRes = await supabase.from('migration_requests').insert({
                type: transferType,
                alliance_tag: allianceTagVal || null
              }).select().single()

              if (reqRes.error) throw reqRes.error

              var requestId = reqRes.data.id
              var membersRes = await supabase.from('migration_members').insert(
                memberPayload.map(function (m) { return Object.assign({ request_id: requestId }, m) })
              )
              if (membersRes.error) throw membersRes.error
            } else {
              console.log('Supabase not available -- migration request not persisted:', { type: transferType, allianceTag: allianceTagVal, members: memberPayload })
            }

            if (successEl) {
              successEl.textContent = 'Migration request sent!'
              successEl.classList.add('visible')
            }
            setTimeout(closeModal, 1200)
          } catch (err) {
            if (errorEl) {
              errorEl.textContent = (err && err.message) || 'Something went wrong.'
              errorEl.classList.add('visible')
            }
          } finally {
            if (submitBtn) submitBtn.disabled = false
          }
        })
      }

      resetTransferState()
    } catch (e) { console.error('migration modal init failed', e) }
  </script>
</body>
</html>
