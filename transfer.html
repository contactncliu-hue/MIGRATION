<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOO - Transfer</title>

  <script>
    (function () {
      function showError(text) {
        var box = document.createElement('div')
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e03131;color:#fff;' +
          'padding:12px 16px;font-size:13px;font-family:monospace;z-index:999999;' +
          'white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.3);'
        box.textContent = text
        var closeBtn = document.createElement('span')
        closeBtn.textContent = ' ✕'
        closeBtn.style.cssText = 'float:right;cursor:pointer;font-weight:bold;'
        closeBtn.onclick = function () { box.remove() }
        box.appendChild(closeBtn)
        if (document.body) document.body.appendChild(box)
        else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box) })
      }
      window.showAppError = showError
      window.addEventListener('error', function (e) {
        showError('JS ERROR: ' + e.message + '\n(' + (e.filename || '') + ':' + e.lineno + ':' + e.colno + ')')
      })
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason)
        showError('PROMISE ERROR: ' + reason)
      })
    })()
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; display: flex; min-height: 100vh; background: #f4f5fa; overflow-x:hidden; }

    /* ================= SIDEBAR ================= */
    .sidebar { width: 240px; min-width:240px; background: #fff; border-right: 1px solid #eee; display: flex; flex-direction: column; padding: 24px 0; transition:margin-left .35s ease, opacity .35s ease; z-index:70; }
    body.sidebar-hidden .sidebar{ margin-left:-240px; opacity:0; pointer-events:none; }
    .sidebar-backdrop{ display:none; }
    .sidebar .logo-img { width: 70px; margin: 0 auto 20px auto; display: block; }
    .user-block { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px 20px; border-bottom: 1px solid #eee; margin-bottom: 12px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #3B5BDB; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .user-info .user-name { font-weight: 700; font-size: 14px; color: #1a1a2e; }
    .user-info .user-role { font-size: 12px; color: #888; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 14px 20px; color: #444; text-decoration: none; font-weight: 600; font-size: 14px; cursor: pointer; letter-spacing: 0.3px; }
    .nav-link:hover { background: #f4f5fa; }
    .nav-link.active { background: #3B5BDB; color: white; }
    .sidebar-bottom { margin-top: auto; padding: 16px 20px 0 20px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-bottom label { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 0.5px; }
    .lang-select { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; font-weight: 600; cursor: pointer; }
    .logout-btn { background: none; border: 1.5px solid #e03131; color: #e03131; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { background: #fff0f0; }

    .menu-toggle{
      position:fixed; top:24px; right:32px; z-index:80;
      width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
      background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    }
    .menu-toggle span{ width:22px; height:3px; border-radius:2px; background:#3B5BDB; display:block; transition:transform .25s ease, opacity .25s ease; }
    body.sidebar-hidden .menu-toggle span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
    body.sidebar-hidden .menu-toggle span:nth-child(2){ opacity:0; }
    body.sidebar-hidden .menu-toggle span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

    @media (max-width:760px){
      .sidebar{ position:fixed; inset:0 auto 0 0; }
      .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,20,30,.4); z-index:65; }
      body:not(.sidebar-hidden) .sidebar-backdrop{ display:block; }
    }

    /* ================= MAIN / HERO STAGE ================= */
    .main-content { flex: 1; position:relative; overflow:hidden; min-height:100vh; }
    .transfer-stage{
      position:relative; width:100%; height:100vh; overflow:hidden;
      background:linear-gradient(160deg, #fff6e0 0%, #fdf3da 22%, #eef4e4 55%, #ffffff 100%);
    }
    .scene{
      position:absolute; left:50%; bottom:0; width:max(100vw, 177.7vh);
      aspect-ratio:2560/1451; transform:translateX(-50%); opacity:0; transition:opacity 1.4s ease;
    }
    .stage-ready .scene{ opacity:1; }
    .deco-bg{ position:absolute; inset:0; pointer-events:none; }
    .deco-bg img{ width:100%; height:100%; display:block; object-fit:fill; }

    .arch-card{
      position:absolute; left:32%; bottom:0; width:36%; z-index:5; opacity:0;
      transform:translateY(90px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .2s, opacity 1.6s ease .2s;
    }
    .stage-ready .arch-card{ opacity:1; transform:translateY(0); }
    .arch-bg{ width:100%; display:block; pointer-events:none; }

    .header-ribbon{
      position:absolute; left:50%; top:11%; width:100%; z-index:8; pointer-events:none; overflow:hidden; opacity:0;
      transform:translate(-50%, 60px);
      transition:transform 2s cubic-bezier(.22,.68,0,1.01) .6s, opacity 1.6s ease .6s;
    }
    .stage-ready .header-ribbon{ opacity:1; transform:translate(-50%, 0); }
    .header-ribbon img{ width:100%; display:block; clip-path:inset(0 0 4% 0); }

    .bottom-fade{
      position:absolute; left:0; right:0; bottom:0; height:10%;
      background:linear-gradient(to bottom, rgba(253,243,218,0) 0%, rgba(253,243,218,.9) 65%, #fdf3da 100%);
      z-index:20; pointer-events:none;
    }

    .transfer-btn{
      position:absolute; left:50%; top:62%; width:26%; z-index:30; border:none; cursor:pointer; padding:0; background:transparent; opacity:0;
      transform:translateX(-50%) translateY(40px) scale(.94);
      transition:filter .2s ease, opacity 1.6s cubic-bezier(.22,.68,0,1.01) 1.1s, transform 1.6s cubic-bezier(.22,.68,0,1.01) 1.1s;
    }
    .stage-ready .transfer-btn{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    .transfer-btn:hover{ filter:brightness(1.06); }
    .transfer-btn:active{ filter:brightness(.94); }
    .transfer-btn img{ width:100%; display:block; }
    .transfer-btn .btn-label{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:1.6vw; letter-spacing:.08vw; color:#fffaf0;
      text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
    }

    .status-open .header-ribbon,
    .status-open .transfer-btn{
      opacity:0 !important; transform:translate(-50%, 60px) !important; pointer-events:none;
      transition:transform 1.4s cubic-bezier(.22,.68,0,1.01), opacity 1s ease;
    }
    .status-open .transfer-btn{ transform:translateX(-50%) translateY(60px) scale(.96) !important; }

    .arch-card.img-failed { background:#fff8ea; border-radius:24px; aspect-ratio:3/4; }
    .transfer-btn.img-failed { background:#f2a90f; border-radius:14px; aspect-ratio:5/1; }

    /* ================= STATUS CARD ================= */
    .status-card{
      position:absolute; top:8%; width:36%; max-width:560px; left:-30%; z-index:36; cursor:pointer;
      transition:left .6s cubic-bezier(.22,.68,0,1.01), width .6s cubic-bezier(.22,.68,0,1.01), max-width .6s cubic-bezier(.22,.68,0,1.01), top .6s cubic-bezier(.22,.68,0,1.01);
    }
    .status-open .status-card{ left:24%; width:52%; max-width:820px; top:9%; cursor:default; }
    .status-card-bg{ width:100%; display:block; pointer-events:none; }

    .status-card-close{
      position:absolute; top:4%; right:5%; width:30px; height:30px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:18px; line-height:1; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-card-close:hover{ background:rgba(255,255,255,.3); }
    .status-open .status-card-close{ opacity:1; pointer-events:auto; transition:opacity .35s ease .35s; }

    .status-rows{
      position:absolute; left:17%; right:19%; top:17%; bottom:17%; display:flex; flex-direction:column; justify-content:space-between; opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .status-open .status-rows{ opacity:1; pointer-events:auto; transition:opacity .4s ease .35s; }
    .status-row{ display:flex; align-items:center; gap:14px; }
    .status-row-icon{ width:40px; height:40px; object-fit:contain; flex-shrink:0; }
    .status-row-body{ flex:1; min-width:0; }
    .status-row-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .status-row-name{ font-size:12px; font-weight:700; color:#fff0ec; letter-spacing:.3px; }
    .status-percent{ font-size:12px; font-weight:800; color:#fff; min-width:34px; text-align:right; }
    .status-bar-track{ width:100%; height:10px; border-radius:999px; background:rgba(255,255,255,.28); overflow:hidden; }
    .status-bar-fill{ height:100%; border-radius:999px; transition:width .4s ease, background .3s ease; }

    .status-admin{ display:flex; align-items:center; gap:6px; margin-top:5px; }
    .status-admin input{
      width:40px; padding:2px 5px; border-radius:6px; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.9); font-size:11px; font-weight:700; text-align:center;
    }
    .status-admin span{ font-size:10px; color:#ffe3de; font-weight:600; }
    .status-total{ font-size:12px; font-weight:800; text-align:right; letter-spacing:.3px; margin-top:4px; }

    .status-check-btn{
      position:absolute; left:50%; top:62%; width:16%; z-index:32; border:none; cursor:pointer; padding:0; background:transparent; opacity:0; pointer-events:none; transform:translateX(-50%) translateY(24px) scale(.94); transition:filter .2s ease, opacity 1s cubic-bezier(.22,.68,0,1.01) .5s, transform 1s cubic-bezier(.22,.68,0,1.01) .5s;
    }
    .status-open .status-check-btn{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1); }
    .status-check-btn img{ width:100%; display:block; }
    .status-check-btn:hover{ filter:brightness(1.06); }
    .status-check-btn:active{ filter:brightness(.94); }
    .status-check-label{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.6vw; letter-spacing:.08vw; color:#fffaf0; text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.15);
    }

    /* ================= MODAL ================= */
    .modal-overlay{
      position:fixed; inset:0; background:rgba(20,20,30,.45); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.visible{ display:flex; }
    .modal-box{
      background:#fff; border-radius:18px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:28px 26px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.25); animation: modalIn .35s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes modalIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
    .modal-close{
      position:absolute; top:14px; right:14px; background:none; border:none; font-size:22px; color:#999; cursor:pointer; width:32px; height:32px; border-radius:8px;
    }
    .modal-close:hover{ background:#f4f5fa; color:#333; }
    .modal-box h2{ font-size:20px; font-weight:800; color:#1a1a2e; margin-bottom:6px; }
    .modal-sub{ font-size:13px; color:#888; margin-bottom:20px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .field input, .field textarea, .field select{
      padding:12px 14px; border-radius:10px; border:1.5px solid #e3e3ec; font-size:14px; font-family:inherit; outline:none; transition:border-color .2s ease; resize:vertical; background:#fff;
    }
    .field input:focus, .field textarea:focus, .field select:focus{ border-color:#3B5BDB; }
    .form-error{ background:#fff0f0; color:#e03131; border:1px solid #ffd6d6; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; display:none; margin-bottom:14px; }
    .form-error.visible{ display:block; }
    .form-success{ background:#f0fff4; color:#2b8a3e; border:1px solid #d3f9d8; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; display:none; margin-bottom:14px; }
    .form-success.visible{ display:block; }
    .submit-btn{
      width:100%; background:#f2a90f; color:#fff; border:none; border-radius:12px; padding:14px; font-weight:800; font-size:15px; letter-spacing:.4px; cursor:pointer; box-shadow:0 5px 0 #c98c0c; transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
    }
    .submit-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #c98c0c; }
    .submit-btn:disabled{ opacity:.7; cursor:default; }

    .transfer-type-toggle{ display:flex; border:1.5px solid #e3e3ec; border-radius:12px; overflow:hidden; margin-bottom:20px; }
    .type-btn{
      flex:1; padding:13px 8px; border:none; background:#f4f5fa; color:#666; font-weight:700; font-size:12.5px; letter-spacing:.2px; cursor:pointer; transition:background .2s ease, color .2s ease;
    }
    .type-btn.active{ background:#fff; color:#f2a90f; }
    .type-btn + .type-btn{ border-left:1.5px solid #e3e3ec; }

    #group-alliance-field{ display:none; }

    .member-row{ border:1.5px solid #eef0f7; border-radius:14px; padding:16px 16px 4px 16px; margin-bottom:16px; background:#fafbff; }
    .member-row-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .member-row-header span{ font-size:11px; font-weight:800; color:#999; letter-spacing:.5px; }
    .remove-member-btn{ background:none; border:1.5px solid #e03131; color:#e03131; border-radius:8px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; }
    .remove-member-btn:hover{ background:#fff0f0; }

    .field-row{ display:flex; gap:12px; }
    .field-row .field{ flex:1; min-width:0; }

    .faction-role-row{ align-items:flex-end; }
    .faction-picker{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .faction-picker label{ font-size:12px; font-weight:700; color:#888; letter-spacing:.4px; }
    .faction-btn{
      width:44px; height:44px; border-radius:50%; border:2px solid #d8dae6; background:#e9eaf2; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .2s ease, border-color .2s ease, transform .15s ease;
    }
    .faction-btn:active{ transform:scale(.92); }
    .faction-btn .faction-letter{ font-weight:800; font-size:14px; color:#fff; }
    .faction-btn[data-state="0"]{ background:#e9eaf2; border-color:#d8dae6; }
    .faction-btn[data-state="1"]{ background:#3b82f6; border-color:#3b82f6; }
    .faction-btn[data-state="2"]{ background:#8b5cf6; border-color:#8b5cf6; }
    .faction-btn[data-state="3"]{ background:#f2a90f; border-color:#f2a90f; }

    .add-member-btn{
      display:none; width:100%; border:1.5px dashed #d8dae6; background:transparent; border-radius:12px; padding:12px; font-weight:700; font-size:13px; color:#666; cursor:pointer; margin-bottom:18px; transition:border-color .2s ease, color .2s ease;
    }
    .add-member-btn:hover{ border-color:#3B5BDB; color:#3B5BDB; }

    @media (max-width:760px){
      .transfer-btn .btn-label{ font-size:3.4vw; }
      .status-check-label{ font-size:3.4vw; }
      .status-check-btn{ width:34%; }
      .status-card{ width:78%; top:6%; left:-70%; }
      .status-open .status-card{ left:11%; width:78%; max-width:none; }
      .status-row-name, .status-percent{ font-size:11px; }
      .field-row{ flex-direction:column; gap:0; }
    }
  </style>
</head>
<body>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar">
    <img src="assets/logo.png.PNG" alt="Logo" class="logo-img" onerror="this.style.display='none'" />

    <div class="user-block">
      <div class="user-avatar" id="user-initial">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Guest</div>
        <div class="user-role" data-i18n="role_label">Role: <span id="user-role">ADMIN</span></div>
      </div>
    </div>

    <a href="index.html" class="nav-link" data-i18n="nav_home">HOMEPAGE</a>
    <a href="transfer.html" class="nav-link active" data-i18n="nav_transfer">TRANSFER</a>
    <a href="admin.html" class="nav-link" id="nav-admin-link" data-i18n="nav_admin">ADMIN &amp; MANAGEMENT</a>

    <div class="sidebar-bottom">
      <label data-i18n="lang_label">LANGUAGE</label>
      <select class="lang-select" id="lang-select">
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="pt-BR">🇧🇷 Português (BR)</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh-CN">🇨🇳 中文（简体）</option>
      </select>
      <button class="logout-btn" id="logout-btn" data-i18n="logout">LOG OUT</button>
    </div>
  </aside>

  <main class="main-content">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>

    <div class="transfer-stage">
      <div class="scene">
        <div class="deco-bg">
          <img src="assets/transfer-bg-deco.PNG" alt="" onerror="this.style.display='none'" />
        </div>
        <div class="arch-card">
          <img class="arch-bg" src="assets/transfer-arch.PNG" alt="" onerror="this.style.display='none'; this.closest('.arch-card').classList.add('img-failed')" />
        </div>
        <div class="header-ribbon">
          <img src="assets/transfer-header.PNG" alt="" onerror="this.style.display='none'" />
        </div>
        <div class="bottom-fade"></div>

        <button class="transfer-btn" id="open-transfer-btn">
          <img src="assets/transfer-button.PNG" alt="" onerror="this.style.display='none'; this.closest('.transfer-btn').classList.add('img-failed')" />
          <span class="btn-label" data-i18n="transfer_cta">MIGRATION</span>
        </button>

        <button class="status-check-btn" id="status-check-btn" type="button">
          <img src="assets/transfer-status-button.PNG" alt="" onerror="this.style.display='none'" />
          <span class="status-check-label" data-i18n="status_check_cta">CHECK STATUS</span>
        </button>
      </div>

      <div class="status-card" id="status-card" aria-hidden="true">
        <img class="status-card-bg" src="assets/transfer-status-card.PNG" alt="" onerror="this.style.display='none'" />
        <button class="status-card-close" id="status-card-close" aria-label="Close">&times;</button>
        <div class="status-rows" id="status-rows"></div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="transfer-modal-overlay">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
      <h2 data-i18n="transfer_heading">Migration</h2>
      <p class="modal-sub" data-i18n="transfer_sub">Send items or funds to another member.</p>

      <div class="transfer-type-toggle" id="transfer-type-toggle">
        <button type="button" class="type-btn active" id="type-solo-btn" data-i18n="type_solo">Solo Transfer</button>
        <button type="button" class="type-btn" id="type-group-btn" data-i18n="type_group">Group Transfer</button>
      </div>

      <form id="transfer-form">
        <div class="field" id="group-alliance-field">
          <label data-i18n="alliance_tag_label">Alliance Tag</label>
          <input type="text" id="alliance-tag" placeholder="e.g. ONE" />
        </div>

        <div id="members-container"></div>
        <button type="button" class="add-member-btn" id="add-member-btn" data-i18n="add_member">+ Add Member</button>

        <div class="form-error" id="transfer-error"></div>
        <div class="form-success" id="transfer-success"></div>

        <button type="submit" class="submit-btn" id="transfer-submit-btn" data-i18n="submit_label">SEND</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function $(id) { return document.getElementById(id) }
    function on(id, evt, fn) {
      var el = $(id)
      if (el) el.addEventListener(evt, fn)
    }
    function escapeAttr(str) {
      return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    }

    try {
      function isMobile(){ return window.matchMedia('(max-width:760px)').matches }
      if (isMobile()) document.body.classList.add('sidebar-hidden')
      on('menu-toggle', 'click', function () { document.body.classList.toggle('sidebar-hidden') })
      on('sidebar-backdrop', 'click', function () { document.body.classList.add('sidebar-hidden') })
    } catch (e) { console.error('sidebar init failed', e) }

    try {
      function playEntrance(){
        var stage = document.querySelector('.transfer-stage')
        if (!stage) return
        stage.classList.remove('stage-ready')
        void stage.offsetWidth
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { stage.classList.add('stage-ready') })
        })
      }
      playEntrance()
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) playEntrance()
      })
    } catch (e) { console.error('stage reveal failed', e) }

    var translations = {
      en: {
        nav_home: "HOMEPAGE", nav_transfer: "TRANSFER", nav_admin: "ADMIN & MANAGEMENT", lang_label: "LANGUAGE",
        logout: "LOG OUT", role_label: "Role: ",
        transfer_heading: "Migration", transfer_sub: "Send items or funds to another member.",
        transfer_cta: "MIGRATION",
        type_solo: "Solo Transfer", type_group: "Group Transfer",
        alliance_tag_label: "Alliance Tag",
        field_uid: "UID", field_username: "Username",
        field_prev_alliance: "Previous Alliance", field_prev_server: "Previous Server",
        field_killcount: "Kill Count", field_faction: "Faction", field_role: "Role",
        field_migration_score: "Migration Score (optional)",
        add_member: "+ Add Member", remove_member: "Remove", member_label: "MEMBER #",
        submit_label: "SEND",
        status_check_cta: "CHECK STATUS",
        form_error_required: "Please fill in every field for every member (Migration Score is the only optional one).",
        wing_red: "RED", wing_orange: "ORANGE", wing_purple: "PURPLE", wing_blue: "BLUE",
        wing_total_label: "Total"
      }
    }

    var currentLang = 'en'
    try { currentLang = localStorage.getItem('zoo_lang') || 'en' } catch (e) {}
    if ($('lang-select')) $('lang-select').value = currentLang

    function t(key, fallback) {
      return (translations[currentLang] && translations[currentLang][key]) || fallback
    }

    function applyTranslations() {
      try {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n')
          if (key === 'role_label') return
          if (translations[currentLang] && translations[currentLang][key]) el.innerHTML = translations[currentLang][key]
        })
      } catch (e) {}
    }
    applyTranslations()

    var statusRows = [
      { key: 'RED', labelKey: 'wing_red', value: 20, color: '#c1442e', icon: 'https://nlqzanjivjfkftvazrvi.supabase.co/storage/v1/object/sign/assets/IMG_7770.png?token=eyJraWQiOiI5NmIyZWE5MC0yYjdiLTQ5MTktYmY3NC1kMGE4YTQzYjU1ZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJhc3NldHMvSU1HXzc3NzAucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODc3Mzg2OCwiZXhwIjoxODIwMzA5ODY4fQ.jgYM18S1iupAzLHn1UCdOcVjHO1lxZiI6iAtRonVyLdp4-OODXY9Rov7ARaeH_g-CE-wXgaDMNPU0sgOwmOTVA' },
      { key: 'ORANGE', labelKey: 'wing_orange', value: 60, color: '#f2a90f', icon: 'https://nlqzanjivjfkftvazrvi.supabase.co/storage/v1/object/sign/assets/IMG_7771.png?token=eyJraWQiOiI5NmIyZWE5MC0yYjdiLTQ5MTktYmY3NC1kMGE4YTQzYjU1ZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJhc3NldHMvSU1HXzc3NzEucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODc3Mzg4OSwiZXhwIjoxODIwMzA5ODg5fQ.emdybSoepVaHA0AEFKPX4QmfQzEuWzJTjKvqIMIFEgBuZlHMqZIR9FZ5nFYvLeUBPV_qtiUcIogyNkG4xvVkZw' },
      { key: 'PURPLE', labelKey: 'wing_purple', value: 50, color: '#8b5cf6', icon: 'https://nlqzanjivjfkftvazrvi.supabase.co/storage/v1/object/sign/assets/IMG_7772.png?token=eyJraWQiOiI5NmIyZWE5MC0yYjdiLTQ5MTktYmY3NC1kMGE4YTQzYjU1ZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJhc3NldHMvSU1HXzc3NzIucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODc3MzkxMCwiZXhwIjoxODIwMzA5OTEwfQ.OaTGQLieD6dNqdyWw08E6Qt9iN1jX9FVOjCGP3uK4SVpLRmqGj5QealsdDuWQs7z_THagYgriNgtCyZLVPkgFQ' },
      { key: 'BLUE', labelKey: 'wing_blue', value: 90, color: '#3b82f6', icon: 'https://nlqzanjivjfkftvazrvi.supabase.co/storage/v1/object/sign/assets/IMG_7772.png?token=eyJraWQiOiI5NmIyZWE5MC0yYjdiLTQ5MTktYmY3NC1kMGE4YTQzYjU1ZTAiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJhc3NldHMvSU1HXzc3NzIucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4ODc3MzkxMCwiZXhwIjoxODIwMzA5OTEwfQ.OaTGQLieD6dNqdyWw08E6Qt9iN1jX9FVOjCGP3uK4SVpLRmqGj5QealsdDuWQs7z_THagYgriNgtCyZLVPkgFQ' }
    ]

    function isPrivileged() { return true; } // Single admin role access guaranteed

    function renderStatusRows() {
      try {
        var container = $('status-rows')
        if (!container) return
        var total = statusRows.reduce(function (sum, r) { return sum + (Math.max(0, Math.min(100, r.value)) || 0) }, 0)

        var rowsHtml = statusRows.map(function (row, i) {
          var pct = Math.max(0, Math.min(100, row.value))
          var name = t(row.labelKey, row.key)
          var adminBlock = '<div class="status-admin">' +
                '<input type="number" min="0" max="100" step="1" value="' + row.value + '" ' +
                  'class="status-admin-input" data-row="' + i + '" aria-label="' + name + ' value out of 100" />' +
                '<span>/100</span>' +
              '</div>'

          return (
            '<div class="status-row" data-row="' + i + '">' +
              (row.icon ? '<img class="status-row-icon" src="' + row.icon + '" alt="' + name + ' icon" onerror="this.style.display=\'none\'" />' : '') +
              '<div class="status-row-body">' +
                '<div class="status-row-top">' +
                  '<span class="status-row-name">' + name + '</span>' +
                  '<span class="status-percent">' + pct + '/100</span>' +
                '</div>' +
                '<div class="status-bar-track"><div class="status-bar-fill" style="width:' + pct + '%; background:' + row.color + ';"></div></div>' +
                adminBlock +
              '</div>' +
            '</div>'
          )
        }).join('')

        var totalHtml = '<div class="status-total" style="color:' + (total === 100 ? '#a3f0b0' : '#ffd9a0') + '">' +
              t('wing_total_label', 'Total') + ': ' + total + '/100' +
            '</div>'

        container.innerHTML = rowsHtml + totalHtml

        container.querySelectorAll('.status-admin-input').forEach(function (input) {
          input.addEventListener('input', function () {
            var idx = parseInt(input.getAttribute('data-row'), 10)
            var val = Math.max(0, Math.min(100, parseInt(input.value, 10) || 0))
            statusRows[idx].value = val
            renderStatusRows()
          })
        })
      } catch (e) {}
    }

    try {
      var statusCard = $('status-card')
      function isStatusOpen() { return document.querySelector('.transfer-stage').classList.contains('status-open') }
      function openStatusCard() {
        document.querySelector('.transfer-stage').classList.add('status-open')
        if (statusCard) statusCard.setAttribute('aria-hidden', 'false')
        renderStatusRows()
      }
      function closeStatusCard() {
        document.querySelector('.transfer-stage').classList.remove('status-open')
        if (statusCard) statusCard.setAttribute('aria-hidden', 'true')
      }

      on('status-card', 'click', function (e) {
        if (e && e.target && e.target.closest && e.target.closest('.status-admin')) return
        if (isStatusOpen()) closeStatusCard()
        else openStatusCard()
      })
      on('status-card-close', 'click', function (e) {
        if (e) e.stopPropagation()
        closeStatusCard()
      })
      renderStatusRows()
    } catch (e) {}

    // Supabase Client Setup
    var SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
    var SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    var transferType = 'solo'
    var members = []

    function createEmptyMember() {
      return { uid: '', username: '', prevAlliance: '', prevServer: '', killcount: '', faction: 0, role: '', migrationScore: '' }
    }

    function factionLetter(state) {
      if (state === 1) return 'F'
      if (state === 2) return 'S'
      if (state === 3) return 'R'
      return ''
    }

    function roleOptionsHtml(selected) {
      var out = '<option value="">--</option>'
      for (var i = 1; i <= 10; i++) {
        var val = 'i' + i
        out += '<option value="' + val + '"' + (selected === val ? ' selected' : '') + '>' + val + '</option>'
      }
      return out
    }

    function updateTypeToggleUI() {
      var soloBtn = $('type-solo-btn')
      var groupBtn = $('type-group-btn')
      var allianceField = $('group-alliance-field')
      var addBtn = $('add-member-btn')
      if (soloBtn) soloBtn.classList.toggle('active', transferType === 'solo')
      if (groupBtn) groupBtn.classList.toggle('active', transferType === 'group')
      if (allianceField) allianceField.style.display = (transferType === 'group') ? 'flex' : 'none'
      if (addBtn) addBtn.style.display = (transferType === 'group') ? 'block' : 'none'
    }

    function renderMembers() {
      try {
        var container = $('members-container')
        if (!container) return
        var showHeader = transferType === 'group'
        var canRemove = transferType === 'group' && members.length > 1

        container.innerHTML = members.map(function (m, idx) {
          var removeBtn = canRemove ? '<button type="button" class="remove-member-btn" data-action="remove" data-idx="' + idx + '">' + t('remove_member', 'Remove') + '</button>' : ''
          var header = showHeader ? '<div class="member-row-header"><span>' + t('member_label', 'MEMBER #') + (idx + 1) + '</span>' + removeBtn + '</div>' : ''

          return (
            '<div class="member-row" data-idx="' + idx + '">' +
              header +
              '<div class="field"><label>' + t('field_uid', 'UID') + '</label><input type="text" class="member-field" data-field="uid" data-idx="' + idx + '" inputmode="numeric" maxlength="13" value="' + escapeAttr(m.uid) + '" /></div>' +
              '<div class="field"><label>' + t('field_username', 'Username') + '</label><input type="text" class="member-field" data-field="username" data-idx="' + idx + '" value="' + escapeAttr(m.username) + '" /></div>' +
              '<div class="field-row">' +
                '<div class="field"><label>' + t('field_prev_alliance', 'Previous Alliance') + '</label><input type="text" class="member-field" data-field="prevAlliance" data-idx="' + idx + '" value="' + escapeAttr(m.prevAlliance) + '" /></div>' +
                '<div class="field"><label>' + t('field_prev_server', 'Previous Server') + '</label><input type="text" class="member-field" data-field="prevServer" data-idx="' + idx + '" value="' + escapeAttr(m.prevServer) + '" /></div>' +
              '</div>' +
              '<div class="field"><label>' + t('field_killcount', 'Kill Count') + '</label><input type="text" class="member-field killcount-field" data-field="killcount" data-idx="' + idx + '" inputmode="numeric" value="' + escapeAttr(m.killcount ? (m.killcount + 'M') : '') + '" /></div>' +
              '<div class="field-row faction-role-row">' +
                '<div class="faction-picker"><label>' + t('field_faction', 'Faction') + '</label><button type="button" class="faction-btn" data-action="faction" data-idx="' + idx + '" data-state="' + (m.faction || 0) + '"><span class="faction-letter">' + factionLetter(m.faction || 0) + '</span></button></div>' +
                '<div class="field"><label>' + t('field_role', 'Role') + '</label><select class="member-field role-select" data-field="role" data-idx="' + idx + '">' + roleOptionsHtml(m.role) + '</select></div>' +
              '</div>' +
              '<div class="field"><label>' + t('field_migration_score', 'Migration Score (optional)') + '</label><input type="text" class="member-field" data-field="migrationScore" data-idx="' + idx + '" inputmode="numeric" value="' + escapeAttr(m.migrationScore) + '" /></div>' +
            '</div>'
          )
        }).join('')
        updateTypeToggleUI()
      } catch (e) {}
    }

    function resetTransferState() {
      transferType = 'solo'
      members = [createEmptyMember()]
      if ($('alliance-tag')) $('alliance-tag').value = ''
      updateTypeToggleUI()
      renderMembers()
    }

    on('type-solo-btn', 'click', function () {
      transferType = 'solo'
      members = [members[0] || createEmptyMember()]
      updateTypeToggleUI()
      renderMembers()
    })
    on('type-group-btn', 'click', function () {
      transferType = 'group'
      if (members.length < 1) members = [createEmptyMember()]
      updateTypeToggleUI()
      renderMembers()
    })
    on('add-member-btn', 'click', function () {
      members.push(createEmptyMember())
      renderMembers()
    })

    try {
      var membersContainer = $('members-container')
      if (membersContainer) {
        membersContainer.addEventListener('input', function (e) {
          var target = e.target
          if (!target || !target.classList) return
          if (target.classList.contains('killcount-field')) {
            var kIdx = parseInt(target.getAttribute('data-idx'), 10)
            var digits = target.value.replace(/[^0-9]/g, '')
            members[kIdx].killcount = digits
            target.value = digits ? (digits + 'M') : ''
            return
          }
          if (target.classList.contains('member-field')) {
            var field = target.getAttribute('data-field')
            var idx = parseInt(target.getAttribute('data-idx'), 10)
            if (field === 'uid') {
              var uidVal = target.value.replace(/[^0-9]/g, '').slice(0, 13)
              target.value = uidVal
              members[idx].uid = uidVal
              return
            }
            members[idx][field] = target.value
          }
        })

        membersContainer.addEventListener('change', function (e) {
          var target = e.target
          if (target && target.classList && target.classList.contains('role-select')) {
            var idx = parseInt(target.getAttribute('data-idx'), 10)
            members[idx].role = target.value
          }
        })

        membersContainer.addEventListener('click', function (e) {
          var factionBtn = e.target.closest && e.target.closest('.faction-btn')
          if (factionBtn) {
            var fIdx = parseInt(factionBtn.getAttribute('data-idx'), 10)
            members[fIdx].faction = ((members[fIdx].faction || 0) + 1) % 4
            renderMembers()
            return
          }
          var removeBtn = e.target.closest && e.target.closest('[data-action="remove"]')
          if (removeBtn) {
            var rIdx = parseInt(removeBtn.getAttribute('data-idx'), 10)
            members.splice(rIdx, 1)
            renderMembers()
          }
        })
      }
    } catch (e) {}

    try {
      var overlay = $('transfer-modal-overlay')
      var form = $('transfer-form')
      var errorEl = $('transfer-error')
      var successEl = $('transfer-success')
      var submitBtn = $('transfer-submit-btn')

      function openModal(){
        resetTransferState()
        if (overlay) overlay.classList.add('visible')
        if (errorEl) errorEl.classList.remove('visible')
        if (successEl) successEl.classList.remove('visible')
        if (submitBtn) submitBtn.disabled = false
      }
      function closeModal(){ if (overlay) overlay.classList.remove('visible') }

      on('open-transfer-btn', 'click', openModal)
      on('modal-close-btn', 'click', closeModal)
      if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal() })

      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault()
          if (errorEl) errorEl.classList.remove('visible')
          if (successEl) successEl.classList.remove('visible')

          var missing = members.some(function (m) {
            return !m.uid || !m.username || !m.prevAlliance || !m.prevServer ||
                   !m.killcount || !(m.faction > 0) || !m.role
          })
          var allianceTagVal = (transferType === 'group' && $('alliance-tag')) ? $('alliance-tag').value.trim() : ''
          if (transferType === 'group' && !allianceTagVal) missing = true

          if (missing) {
            if (errorEl) {
              errorEl.textContent = t('form_error_required', 'Please fill in every field for every member.')
              errorEl.classList.add('visible')
            }
            return
          }

          if (submitBtn) submitBtn.disabled = true
          try {
            var memberPayload = members.map(function (m) {
              return {
                uid: m.uid,
                username: m.username,
                previous_alliance: m.prevAlliance,
                previous_server: m.prevServer,
                kill_count: m.killcount ? (m.killcount + 'M') : '',
                faction: factionLetter(m.faction || 0),
                role: m.role,
                migration_score: m.migrationScore ? Number(m.migrationScore) : null
              }
            })

            // Syncs directly to Supabase tables matching index setup
            var reqRes = await supabase.from('migration_requests').insert({
              type: transferType,
              alliance_tag: allianceTagVal || null
            }).select().single()

            if (reqRes.error) throw reqRes.error

            var requestId = reqRes.data.id
            var membersRes = await supabase.from('migration_members').insert(
              memberPayload.map(function (m) { return Object.assign({ request_id: requestId }, m) })
            )
            if (membersRes.error) throw membersRes.error

            if (successEl) {
              successEl.textContent = 'Migration request sent successfully!'
              successEl.classList.add('visible')
            }
            setTimeout(closeModal, 1200)
          } catch (err) {
            if (errorEl) {
              errorEl.textContent = (err && err.message) || 'Something went wrong.'
              errorEl.classList.add('visible')
            }
          } finally {
            if (submitBtn) submitBtn.disabled = false
          }
        })
      }
      resetTransferState()
    } catch (e) {}
  </script>
