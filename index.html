<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZOO - Homepage</title>
<style>
  @font-face {
    font-family: 'Daruma Drop One';
    src: url('assets/fonts/DarumaDropOne-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Poppins', sans-serif;
    display:flex;
    min-height:100vh;
    background:linear-gradient(to top, #FFFAF1 0%, #ffffff 45%);
    overflow-x:hidden;
  }

  /* Background landscape scenery (matches login.html) -- fixed to the
     viewport corners, sits behind everything else on the page. */
  .scene{
    position:fixed; bottom:0;
    z-index:0; height:auto;
    pointer-events:none;
  }
  .scene-left{ left:0; width:34vw; max-width:380px; }
  .scene-right{ right:0; width:34vw; max-width:380px; }

  /* ================= SIDEBAR (new beach-themed design) ================= */
  .sidebar{
    width:240px; min-width:240px;
    background-image:url('assets/sidebar.PNG');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    border-right:none;
    display:flex; flex-direction:column; padding:28px 0 22px 0;
    transition:margin-left .35s ease, opacity .35s ease;
    z-index:70;
    font-family:'Daruma Drop One', sans-serif;
    color:#fff;
    position:fixed; top:0; left:0;
    height:100vh;
    overflow:hidden;
  }

  .welcome-block{
    flex-shrink:0;
    display:flex; align-items:center; gap:14px;
    padding:0 24px 30px 24px;
  }
  .user-avatar{
    width:56px; height:56px; border-radius:50%;
    background:#FFF6C9; color:#2AA9F2;
    display:flex; align-items:center; justify-content:center;
    font-weight:400; font-size:22px; flex-shrink:0;
    font-family:'Daruma Drop One', sans-serif;
    position:relative; overflow:hidden;
  }
  .user-avatar.admin{ color:#B4784E; } /* brown "A" on the same pale circle */
  .welcome-text{ display:flex; flex-direction:column; min-width:0; }
  .welcome-label{
    font-size:20px; color:#fff; letter-spacing:.5px; line-height:1.15;
  }
  .user-name{
    font-size:12px; color:rgba(255,255,255,.85); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .user-role{ display:none; } /* role no longer shown in the new layout */

  .sidebar-nav{ display:flex; flex-direction:column; gap:24px; margin-top:6px; flex-shrink:0; }
  .nav-link{
    display:block;
    padding:14px 20px 14px 24px;
    color:#fff; text-decoration:none;
    font-family:'Daruma Drop One', sans-serif;
    font-weight:400; font-size:21px; letter-spacing:.5px;
    text-transform:uppercase;
    white-space:nowrap;
    background:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,0) 85%);
    border-radius:0 40px 40px 0;
    transition:background .2s ease;
  }
  .nav-link:hover{ background:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,.25) 90%); }
  .nav-link.active{ background:linear-gradient(90deg, #00C2FF 0%, rgba(0,194,255,.35) 90%); }

  .sidebar-bottom{
    margin-top:auto; padding:20px 24px 24px 24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:none;
  }
  .sidebar-bottom label{ display:none; } /* "LANGUAGE" caption dropped to match the compact badge look */
  .lang-select{
    padding:8px 10px; border-radius:20px; border:none;
    background:rgba(20,20,30,.4); color:#fff;
    font-family:'Daruma Drop One', sans-serif;
    font-weight:400; font-size:13px; cursor:pointer;
    -webkit-appearance:none; appearance:none;
    text-align:center;
  }
  .logout-btn{
    background:#FFAFAF; border:none; color:#E85454;
    padding:10px 20px; border-radius:16px;
    font-family:'Daruma Drop One', sans-serif;
    font-weight:400; font-size:15px; text-transform:uppercase; cursor:pointer;
    white-space:nowrap;
  }
  .logout-btn:hover{ background:#ff9d9d; }
  .logout-btn:disabled{ opacity:.6; cursor:default; }

  body.sidebar-hidden .sidebar{ margin-left:-240px; opacity:0; pointer-events:none; }

  /* ---------- mobile backdrop (tap outside to close the drawer) ---------- */
  .sidebar-backdrop{ display:none; }

  /* ================= MAIN ================= */
  .main-content{ flex:1; position:relative; min-height:100vh; overflow:hidden; margin-left:240px; transition:margin-left .35s ease; }
  body.sidebar-hidden .main-content{ margin-left:0; }

  .menu-toggle{
    position:fixed; top:24px; right:32px; z-index:80;
    width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
    background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  }
  .menu-toggle span{ width:22px; height:3px; border-radius:2px; background:#3B5BDB; display:block; transition:transform .25s ease, opacity .25s ease; }
  body.sidebar-hidden .menu-toggle span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
  body.sidebar-hidden .menu-toggle span:nth-child(2){ opacity:0; }
  body.sidebar-hidden .menu-toggle span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

  .lineup-note{
    text-align:center; font-weight:700; color:#c98c0c; letter-spacing:.3px;
    text-transform:uppercase;
    font-size:14px; padding:28px 20px 0 20px; position:relative; z-index:5;
  }

  /* ---------- carousel : pinned to the real viewport (not a flow container) ---------- */
  .carousel{
    position:fixed; top:0; left:240px; right:0; bottom:0;
    z-index:1;
    overflow:hidden; /* crops the peeking side-portals flush to the bottom edge */
    transition:left .35s ease;
  }
  body.sidebar-hidden .carousel{ left:0; }

  .nav-arrow{
    position:absolute; top:66%; transform:translateY(-50%);
    z-index:45;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:transparent;
    box-shadow:none;
    color:#4b4b55; font-size:26px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .nav-arrow:hover{ background:rgba(255,255,255,.35); color:#1f1f24; }
  .nav-arrow.prev{ left:24px; }
  .nav-arrow.next{ right:24px; }

  /* portal width:height matches the arch artwork's own ratio (1640:2156)
     so object-fit:contain fills the box exactly -- nothing floats below it.
     Enlarged slightly per request (icons excluded from this). */
  .portal{
    position:absolute; left:50%; bottom:0;
    width:680px;
    height:894px;
    transition:transform 1.1s cubic-bezier(.22,.68,0,1.01), opacity .9s ease, filter .9s ease;
    cursor:pointer;
  }
  .portal.pos-center{ transform:translateX(-50%) scale(1); z-index:20; opacity:1; filter:none; }
  .portal.pos-left,
  .portal.pos-right{ transform-origin:bottom center; z-index:10; opacity:1; filter:none; }
  /* Non-active cards: pushed out toward the screen edges so about half of
     each card peeks in, cropped by .carousel's overflow. */
  .portal.pos-left{  transform:translate(calc(-50% - 660px), 0px) scale(.7); }
  .portal.pos-right{ transform:translate(calc(-50% + 660px), 0px) scale(.7); }

  .portal-arch{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain; object-position:top center;
    pointer-events:none;
  }

  /* title logo (ZOO / SDL style wordmark): floats above everything else,
     centered over the arch, only shown for the active/center card. */
  .portal-title{
    position:absolute; left:50%; top:8%;
    width:57%; max-width:355px;
    transform:translate(-48%, 40px);
    transition:transform 1.6s cubic-bezier(.22,.68,0,1.01), opacity 1.3s ease;
    opacity:0; pointer-events:none;
    z-index:16;
  }
  .portal-title img{ width:100%; display:block; }

  /* header ornament: nudged slightly right so the star lines up visually
     centered on the arch (the artwork itself is a touch left-heavy). */
  .portal-header{
    position:absolute; left:50%; top:-6%;
    width:155%; max-width:900px;
    transform:translate(-46%, 35%);
    transition:transform 1.6s cubic-bezier(.22,.68,0,1.01), opacity 1.3s ease;
    opacity:0; pointer-events:none;
    z-index:15;
  }
  .portal-header img{ width:100%; display:block; }

  /* icons: shrunk down and raised above the bottom fade so the times are
     actually legible again. */
  .portal-icons{
    position:absolute; left:50%; bottom:16%;
    width:46%;
    transform:translate(-50%, 60px);
    transition:transform 1.6s cubic-bezier(.22,.68,0,1.01), opacity 1.2s ease;
    opacity:0;
    z-index:50; /* above absolutely everything, including the nav arrows */
  }
  .portal-icons img{ width:100%; display:block; }

  .portal.pos-center .portal-title{ opacity:1; transform:translate(-48%, 0%); pointer-events:auto; }
  .portal.pos-center .portal-header{ opacity:1; transform:translate(-46%, 0%); pointer-events:auto; }
  .portal.pos-center .portal-icons{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- bottom fade: sits above the arch, below the icons ---------- */
  .bottom-fade{
    position:fixed; left:0; right:0; bottom:0; height:14vh;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.6) 75%, #ffffff 100%);
    z-index:25; pointer-events:none;
  }

  /* ================= DESKTOP: scenery layered above the arches ========= */
  @media (min-width:761px){
    .scene{ z-index:30; }
  }

  /* ================= MOBILE ================= */
  @media (max-width:760px){
    .sidebar{ position:fixed; inset:0 auto 0 0; z-index:70; }
    body.sidebar-hidden .sidebar{ margin-left:-240px; }
    .main-content{ margin-left:0; }

    .sidebar-backdrop{
      display:none;
      position:fixed; inset:0; background:rgba(20,20,30,.4);
      z-index:65;
    }
    body:not(.sidebar-hidden) .sidebar-backdrop{ display:block; }

    .carousel{ left:0; }
    body.sidebar-hidden .carousel{ left:0; }

    .bottom-fade{
      height:8vh;
      background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 80%, #ffffff 100%);
    }

    .nav-arrow{
      top:auto; bottom:80px; transform:none; width:60px; height:60px; font-size:30px;
      background:transparent; color:#3B5BDB; border:none;
      box-shadow:none;
    }
    .nav-arrow.prev{ left:16px; }
    .nav-arrow.next{ right:16px; }

    .portal{ left:50%; width:88vw; max-width:390px; height: calc(88vw / 0.7607); bottom:0; }
    .portal.pos-center{ transform:translateX(-50%) scale(1); }

    .portal-title{ top:7%; width:78%; max-width:310px; transform:translate(-48%, 40px); }
    .portal.pos-center .portal-title{ transform:translate(-48%, 0%); }

    .portal-icons{ bottom:4%; width:52%; }

    /* scenery: same treatment as login.html's mobile breakpoint --
       left half pinned to the bottom-left corner, right half a touch
       bigger and lifted slightly off the bottom edge. */
    .scene-left, .scene-right{ width:62vw; max-width:340px; }
    .scene-left{ left:-2vw; bottom:0; }
    .scene-right{ width:70vw; max-width:360px; transform:translateY(-8%); }

    /* Unselected cards: hang from the TOP of the screen instead of the
       bottom, offset far enough sideways that roughly half of each card
       peeks out past the center card's edges -- matching the reference:
       tall colored slivers at the left/right edges, never dimmed. */
    .portal.pos-left, .portal.pos-right{ top:0; bottom:auto; }
    .portal.pos-left{  transform:translate(calc(-50% - 150px), 0) scale(.8); z-index:10; }
    .portal.pos-right{ transform:translate(calc(-50% + 150px), 0) scale(.8); z-index:9; }

    /* soften the seam where a peeking card tucks behind the active one --
       own fade at each card's own bottom so the cutoff isn't a hard edge */
    .portal.pos-left::after, .portal.pos-right::after{
      content:""; position:absolute; left:0; right:0; bottom:-2px; height:46%;
      background:linear-gradient(to bottom, rgba(255,255,255,0), #ffffff 96%);
      z-index:26; pointer-events:none;
    }
  }
</style>
</head>
<body>

  <img src="assets/scene-left.png" class="scene scene-left" alt="" />
  <img src="assets/scene-right.png" class="scene scene-right" alt="" />

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar">
    <div class="welcome-block">
      <div class="user-avatar" id="userAvatar">
        <span id="user-initial">?</span>
      </div>
      <div class="welcome-text">
        <div class="welcome-label" data-i18n="welcome">WELCOME</div>
        <div class="user-name" id="user-name">Member</div>
        <span class="user-role" id="user-role">MEMBER</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-link active" data-i18n="homepage">HOMEPAGE</a>
      <a href="transfer.html" class="nav-link" data-i18n="transfer">TRANSFER</a>
    </nav>

    <div class="sidebar-bottom">
      <button class="logout-btn" id="logoutBtn" data-i18n="logout">LOG OUT</button>
      <select class="lang-select" id="langSelect">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="pt-BR">PT</option>
        <option value="vi">VI</option>
        <option value="ko">KR</option>
        <option value="zh-CN">CN</option>
      </select>
    </div>
  </aside>

  <main class="main-content">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>

    <p class="lineup-note" data-i18n="datesNote">Time can be subject to change</p>

    <div class="carousel" id="carousel">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">&lt;</button>

      <div class="portal" data-index="0">
        <div class="portal-title"><img src="assets/title-purple.PNG" alt=""></div>
        <div class="portal-header"><img src="assets/header-purple.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-purple.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-purple.PNG" alt=""></div>
      </div>

      <div class="portal" data-index="1">
        <div class="portal-title"><img src="assets/title-red.PNG" alt=""></div>
        <div class="portal-header"><img src="assets/header-red.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-red.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-red.PNG" alt=""></div>
      </div>

      <div class="portal" data-index="2">
        <div class="portal-title"><img src="assets/title-green.PNG" alt=""></div>
        <div class="portal-header"><img src="assets/header-green.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-green.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-green.PNG" alt=""></div>
      </div>

      <button class="nav-arrow next" id="nextBtn" aria-label="Next">&gt;</button>
    </div>

    <div class="bottom-fade"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const portals   = Array.from(document.querySelectorAll('.portal'));
  let active = 1; // start on the center (red) tab

  function render(){
    const n = portals.length;
    portals.forEach((el, i) => {
      el.classList.remove('pos-center','pos-left','pos-right');
      const raw = (i - active + n) % n; // 0 = this one is active, 1 = sits to the right, 2(=-1) = sits to the left
      if (raw === 0) el.classList.add('pos-center');
      else if (raw === 1) el.classList.add('pos-right');
      else el.classList.add('pos-left');
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    active = (active - 1 + portals.length) % portals.length; render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    active = (active + 1) % portals.length; render();
  });
  portals.forEach((el, i) => el.addEventListener('click', () => { active = i; render(); }));

  render();

  // ---------- sidebar drawer (mobile: starts closed, backdrop to dismiss) ----------
  function isMobile(){ return window.matchMedia('(max-width:760px)').matches; }
  if (isMobile()) document.body.classList.add('sidebar-hidden');

  document.getElementById('menuToggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-hidden');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', () => {
    document.body.classList.add('sidebar-hidden');
  });

  // ---------- Language switcher: translates UI labels only, never data ----------
  // (username, role value, and the event carousel artwork are left untouched)
  const translations = {
    en:   { welcome:'WELCOME', homepage:'HOMEPAGE', transfer:'TRANSFER', language:'LANGUAGE', logout:'LOG OUT', loggingOut:'LOGGING OUT...', roleLabel:'Role:', datesNote:'Time can be subject to change' },
    fr:   { welcome:'BIENVENUE', homepage:'ACCUEIL',  transfer:'TRANSFERT', language:'LANGUE', logout:'DÉCONNEXION', loggingOut:'DÉCONNEXION...', roleLabel:'Rôle :', datesNote:"L'heure peut être sujette à changement" },
    'pt-BR': { welcome:'BEM-VINDO', homepage:'PÁGINA INICIAL', transfer:'TRANSFERÊNCIA', language:'IDIOMA', logout:'SAIR', loggingOut:'SAINDO...', roleLabel:'Função:', datesNote:'O horário pode estar sujeito a alterações' },
    vi:   { welcome:'CHÀO MỪNG', homepage:'TRANG CHỦ', transfer:'CHUYỂN KHOẢN', language:'NGÔN NGỮ', logout:'ĐĂNG XUẤT', loggingOut:'ĐANG ĐĂNG XUẤT...', roleLabel:'Vai trò:', datesNote:'Thời gian có thể thay đổi' },
    ko:   { welcome:'환영합니다', homepage:'홈', transfer:'이체', language:'언어', logout:'로그아웃', loggingOut:'로그아웃 중...', roleLabel:'역할:', datesNote:'시간은 변경될 수 있습니다' },
    'zh-CN': { welcome:'欢迎', homepage:'主页', transfer:'转账', language:'语言', logout:'退出登录', loggingOut:'正在退出...', roleLabel:'角色：', datesNote:'时间可能会有变动' }
  }

  const langSelect = document.getElementById('langSelect')

  function applyLanguage(lang){
    const dict = translations[lang] || translations.en
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n')
      if (dict[key]) el.textContent = dict[key]
    })
    try { localStorage.setItem('zoo_lang', lang) } catch (e) { /* storage unavailable, no-op */ }
  }

  let savedLang = 'en'
  try { savedLang = localStorage.getItem('zoo_lang') || 'en' } catch (e) { /* no-op */ }
  langSelect.value = translations[savedLang] ? savedLang : 'en'
  applyLanguage(langSelect.value)

  langSelect.addEventListener('change', () => applyLanguage(langSelect.value))

  // ---------- Supabase: populate member info + wire up log out ----------
  const SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
  const SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
  const logoutBtn = document.getElementById('logoutBtn')

  let supabaseClient = null
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        supabaseClient.auth.getUser().then(async ({ data: { user } }) => {
      if (!user) return

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('display_name, role')
        .eq('id', user.id)
        .single()

      if (error) {
        console.error('profiles lookup failed:', error)
      }

      const uname = (profile && profile.display_name) || (user.email || 'Member').split('@')[0]
      document.getElementById('user-name').textContent = uname
      document.getElementById('user-initial').textContent = uname.charAt(0).toUpperCase()

      const role = (profile && profile.role) ? profile.role.toUpperCase() : 'GUEST'
      const roleEl = document.getElementById('user-role')
      if (roleEl) roleEl.textContent = role

      // Admins get a brown "A" on the avatar circle instead of their initial
      const avatarEl = document.getElementById('userAvatar')
      const initialEl = document.getElementById('user-initial')
      if (role === 'ADMIN') {
        avatarEl.classList.add('admin')
        initialEl.textContent = 'A'
      } else {
        avatarEl.classList.remove('admin')
      }
    }).catch(err => console.error('getUser failed:', err))
  }

  logoutBtn.addEventListener('click', async () => {
    const dict = translations[langSelect.value] || translations.en
    logoutBtn.disabled = true
    logoutBtn.textContent = dict.loggingOut
    try {
      if (supabaseClient) await supabaseClient.auth.signOut()
    } catch (err) {
      console.error('Sign out failed:', err)
    }
    window.location.href = 'login.html'
  })
  </script>
</body>
</html>
