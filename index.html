<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZOO - Homepage</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Poppins', sans-serif;
    display:flex;
    min-height:100vh;
    background:#f4f5fa;
    overflow-x:hidden;
  }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width:240px; min-width:240px; background:#fff; border-right:1px solid #eee;
    display:flex; flex-direction:column; padding:24px 0;
    transition:margin-left .35s ease, opacity .35s ease;
    z-index:70;
  }
  .sidebar .logo-img{ width:70px; margin:0 auto 20px auto; display:block; }
  .user-block{ display:flex; align-items:center; gap:12px; padding:0 20px 20px 20px; border-bottom:1px solid #eee; margin-bottom:12px; }
  .user-avatar{ width:40px; height:40px; border-radius:50%; background:#3B5BDB; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
  .user-info .user-name{ font-weight:700; font-size:14px; color:#1a1a2e; }
  .user-info .user-role{ font-size:12px; color:#888; }
  .nav-link{ display:flex; align-items:center; gap:10px; padding:14px 20px; color:#444; text-decoration:none; font-weight:600; font-size:14px; letter-spacing:.3px; }
  .nav-link:hover{ background:#f4f5fa; }
  .nav-link.active{ background:#3B5BDB; color:#fff; }
  .sidebar-bottom{ margin-top:auto; padding:16px 20px 0 20px; border-top:1px solid #eee; display:flex; flex-direction:column; gap:10px; }
  .sidebar-bottom label{ font-size:11px; font-weight:700; color:#999; letter-spacing:.5px; }
  .lang-select{ padding:8px 10px; border-radius:8px; border:1px solid #ddd; font-size:14px; font-weight:600; cursor:pointer; }
  .logout-btn{ background:none; border:1.5px solid #e03131; color:#e03131; padding:10px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
  .logout-btn:hover{ background:#fff0f0; }
  .logout-btn:disabled{ opacity:.6; cursor:default; }

  body.sidebar-hidden .sidebar{ margin-left:-240px; opacity:0; pointer-events:none; }

  /* ---------- mobile backdrop (tap outside to close the drawer) ---------- */
  .sidebar-backdrop{ display:none; }

  /* ================= MAIN ================= */
  .main-content{ flex:1; position:relative; min-height:100vh; overflow:hidden; }

  .menu-toggle{
    position:fixed; top:24px; right:32px; z-index:80;
    width:46px; height:46px; border-radius:12px; border:none; cursor:pointer;
    background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  }
  .menu-toggle span{ width:22px; height:3px; border-radius:2px; background:#3B5BDB; display:block; transition:transform .25s ease, opacity .25s ease; }
  body.sidebar-hidden .menu-toggle span:nth-child(1){ transform:translateY(8px) rotate(45deg); }
  body.sidebar-hidden .menu-toggle span:nth-child(2){ opacity:0; }
  body.sidebar-hidden .menu-toggle span:nth-child(3){ transform:translateY(-8px) rotate(-45deg); }

  .lineup-note{
    text-align:center; font-weight:700; color:#2c3562; letter-spacing:.3px;
    font-size:14px; padding:28px 20px 0 20px; position:relative; z-index:5;
  }

  /* ---------- carousel : pinned to the real viewport (not a flow container) ---------- */
  .carousel{
    position:fixed; top:0; left:240px; right:0; bottom:0;
    z-index:1;
    overflow:hidden; /* crops the peeking side-portals flush to the bottom edge */
    transition:left .35s ease;
  }
  body.sidebar-hidden .carousel{ left:0; }

  .nav-arrow{
    position:absolute; top:66%; transform:translateY(-50%);
    z-index:45;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.92);
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    color:#4b4b55; font-size:26px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .nav-arrow:hover{ background:#fff; color:#1f1f24; }
  .nav-arrow.prev{ left:24px; }
  .nav-arrow.next{ right:24px; }

  /* portal width:height matches the arch artwork's own ratio (1640:2156)
     so object-fit:contain fills the box exactly -- nothing floats below it.
     Enlarged slightly per request (icons excluded from this). */
  .portal{
    position:absolute; left:50%; bottom:0;
    width:520px;
    height:683px;
    transition:transform 1.1s cubic-bezier(.22,.68,0,1.01), opacity .9s ease, filter .9s ease;
    cursor:pointer;
  }
  .portal.pos-center{ transform:translateX(-50%) scale(1); z-index:20; opacity:1; filter:none; }
  .portal.pos-left,
  .portal.pos-right{ transform-origin:bottom center; z-index:10; opacity:.85; filter:brightness(.85); }
  /* Non-active cards: pushed down slightly and clipped by .carousel's
     overflow so the bottom edge is trimmed, "stuck" to the floor -- but
     pulled in closer than before so they're not clipped by the carousel's
     own side edges too, which is what was making them nearly vanish. */
  .portal.pos-left{  transform:translate(calc(-50% - 380px), 70px) scale(.74); }
  .portal.pos-right{ transform:translate(calc(-50% + 380px), 70px) scale(.74); }

  .portal-arch{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain; object-position:top center;
    pointer-events:none;
  }
  /* header ornament: nudged slightly right so the star lines up visually
     centered on the arch (the artwork itself is a touch left-heavy). */
  .portal-header{
    position:absolute; left:50%; top:-6%;
    width:136%; max-width:710px;
    transform:translate(-46%, 35%);
    transition:transform 1.6s cubic-bezier(.22,.68,0,1.01), opacity 1.3s ease;
    opacity:0; pointer-events:none;
    z-index:15;
  }
  .portal-header img{ width:100%; display:block; }

  /* icons: shrunk down and raised above the bottom fade so the times are
     actually legible again. */
  .portal-icons{
    position:absolute; left:50%; top:36%;
    width:46%;
    transform:translate(-50%, 60px);
    transition:transform 1.6s cubic-bezier(.22,.68,0,1.01), opacity 1.2s ease;
    opacity:0;
    z-index:50; /* above absolutely everything, including the nav arrows */
  }
  .portal-icons img{ width:100%; display:block; }

  .portal.pos-center .portal-header{ opacity:1; transform:translate(-46%, 0%); pointer-events:auto; }
  .portal.pos-center .portal-icons{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- bottom fade: sits above the arch, below the icons ---------- */
  .bottom-fade{
    position:fixed; left:0; right:0; bottom:0; height:14vh;
    background:linear-gradient(to bottom, rgba(244,245,250,0) 0%, rgba(244,245,250,.6) 75%, #f4f5fa 100%);
    z-index:25; pointer-events:none;
  }

  /* ================= MOBILE ================= */
  @media (max-width:760px){
    .sidebar{ position:fixed; inset:0 auto 0 0; z-index:70; }
    body.sidebar-hidden .sidebar{ margin-left:-240px; }

    .sidebar-backdrop{
      display:none;
      position:fixed; inset:0; background:rgba(20,20,30,.4);
      z-index:65;
    }
    body:not(.sidebar-hidden) .sidebar-backdrop{ display:block; }

    .carousel{ left:0; }
    body.sidebar-hidden .carousel{ left:0; }

    .nav-arrow{
      top:auto; bottom:26px; transform:none; width:50px; height:50px; font-size:24px;
      background:#fff; color:#3B5BDB; border:2px solid #3B5BDB;
      box-shadow:0 4px 12px rgba(0,0,0,.2);
    }
    .nav-arrow.prev{ left:16px; }
    .nav-arrow.next{ right:16px; }

    .portal{ left:50%; width:88vw; max-width:390px; height: calc(88vw / 0.7607); bottom:0; }
    .portal.pos-center{ transform:translateX(-50%) scale(1); }
    .portal.pos-left{  transform:translate(calc(-50% - 10px), -40px) scale(.9); z-index:10; }
    .portal.pos-right{ transform:translate(calc(-50% + 10px), -40px) scale(.9); z-index:9; }

    /* soften the seam where a peeking card tucks behind the active one --
       stronger/taller fade so the straight artwork cutoff is fully hidden */
    .portal.pos-left::after, .portal.pos-right::after{
      content:""; position:absolute; left:0; right:0; bottom:-2px; height:46%;
      background:linear-gradient(to bottom, rgba(244,245,250,0), #f4f5fa 96%);
      z-index:26; pointer-events:none;
    }
  }
</style>
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar">
    <img src="assets/logo.png.PNG" alt="Logo" class="logo-img" />
    <div class="user-block">
      <div class="user-avatar" id="user-initial">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Member</div>
        <div class="user-role"><span data-i18n="roleLabel">Role:</span> <span id="user-role">MEMBER</span></div>
      </div>
    </div>
    <a href="index.html" class="nav-link active" data-i18n="homepage">HOMEPAGE</a>
    <a href="transfer.html" class="nav-link" data-i18n="transfer">TRANSFER</a>
    <div class="sidebar-bottom">
      <label data-i18n="language">LANGUAGE</label>
      <select class="lang-select" id="langSelect">
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="pt-BR">🇧🇷 Português (BR)</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh-CN">🇨🇳 中文（简体）</option>
      </select>
      <button class="logout-btn" id="logoutBtn" data-i18n="logout">LOG OUT</button>
    </div>
  </aside>

  <main class="main-content">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>

    <p class="lineup-note" data-i18n="datesNote">Dates can be subjected to change</p>

    <div class="carousel" id="carousel">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">&lt;</button>

      <div class="portal" data-index="0">
        <div class="portal-header"><img src="assets/header-purple.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-purple.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-purple.PNG" alt=""></div>
      </div>

      <div class="portal" data-index="1">
        <div class="portal-header"><img src="assets/header-red.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-red.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-red.PNG" alt=""></div>
      </div>

      <div class="portal" data-index="2">
        <div class="portal-header"><img src="assets/header-green.PNG" alt=""></div>
        <img class="portal-arch" src="assets/arch-green.PNG" alt="">
        <div class="portal-icons"><img src="assets/icons-green.PNG" alt=""></div>
      </div>

      <button class="nav-arrow next" id="nextBtn" aria-label="Next">&gt;</button>
    </div>

    <div class="bottom-fade"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const portals   = Array.from(document.querySelectorAll('.portal'));
  let active = 1; // start on the center (red) tab

  function render(){
    const n = portals.length;
    portals.forEach((el, i) => {
      el.classList.remove('pos-center','pos-left','pos-right');
      const raw = (i - active + n) % n; // 0 = this one is active, 1 = sits to the right, 2(=-1) = sits to the left
      if (raw === 0) el.classList.add('pos-center');
      else if (raw === 1) el.classList.add('pos-right');
      else el.classList.add('pos-left');
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    active = (active - 1 + portals.length) % portals.length; render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    active = (active + 1) % portals.length; render();
  });
  portals.forEach((el, i) => el.addEventListener('click', () => { active = i; render(); }));

  render();

  // ---------- sidebar drawer (mobile: starts closed, backdrop to dismiss) ----------
  function isMobile(){ return window.matchMedia('(max-width:760px)').matches; }
  if (isMobile()) document.body.classList.add('sidebar-hidden');

  document.getElementById('menuToggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-hidden');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', () => {
    document.body.classList.add('sidebar-hidden');
  });

  // ---------- Language switcher: translates UI labels only, never data ----------
  // (username, role value, and the event carousel artwork are left untouched)
  const translations = {
    en:   { homepage:'HOMEPAGE', transfer:'TRANSFER', language:'LANGUAGE', logout:'LOG OUT', loggingOut:'LOGGING OUT...', roleLabel:'Role:', datesNote:'Dates can be subjected to change' },
    fr:   { homepage:'ACCUEIL',  transfer:'TRANSFERT', language:'LANGUE', logout:'DÉCONNEXION', loggingOut:'DÉCONNEXION...', roleLabel:'Rôle :', datesNote:'Les dates sont susceptibles de changer' },
    'pt-BR': { homepage:'PÁGINA INICIAL', transfer:'TRANSFERÊNCIA', language:'IDIOMA', logout:'SAIR', loggingOut:'SAINDO...', roleLabel:'Função:', datesNote:'As datas estão sujeitas a alterações' },
    vi:   { homepage:'TRANG CHỦ', transfer:'CHUYỂN KHOẢN', language:'NGÔN NGỮ', logout:'ĐĂNG XUẤT', loggingOut:'ĐANG ĐĂNG XUẤT...', roleLabel:'Vai trò:', datesNote:'Ngày có thể thay đổi' },
    ko:   { homepage:'홈', transfer:'이체', language:'언어', logout:'로그아웃', loggingOut:'로그아웃 중...', roleLabel:'역할:', datesNote:'날짜는 변경될 수 있습니다' },
    'zh-CN': { homepage:'主页', transfer:'转账', language:'语言', logout:'退出登录', loggingOut:'正在退出...', roleLabel:'角色：', datesNote:'日期可能会有变动' }
  }

  const langSelect = document.getElementById('langSelect')

  function applyLanguage(lang){
    const dict = translations[lang] || translations.en
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n')
      if (dict[key]) el.textContent = dict[key]
    })
    try { localStorage.setItem('zoo_lang', lang) } catch (e) { /* storage unavailable, no-op */ }
  }

  let savedLang = 'en'
  try { savedLang = localStorage.getItem('zoo_lang') || 'en' } catch (e) { /* no-op */ }
  langSelect.value = translations[savedLang] ? savedLang : 'en'
  applyLanguage(langSelect.value)

  langSelect.addEventListener('change', () => applyLanguage(langSelect.value))

  // ---------- Supabase: populate member info + wire up log out ----------
  const SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
  const SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
  const logoutBtn = document.getElementById('logoutBtn')

  let supabaseClient = null
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    supabaseClient.auth.getUser().then(({ data: { user } }) => {
      if (!user) return
      const meta = user.user_metadata || {}
      const uname = meta.username || (user.email || 'Member').split('@')[0]
      document.getElementById('user-name').textContent = uname
      document.getElementById('user-initial').textContent = uname.charAt(0).toUpperCase()
    }).catch(err => console.error('getUser failed:', err))
  }

  logoutBtn.addEventListener('click', async () => {
    const dict = translations[langSelect.value] || translations.en
    logoutBtn.disabled = true
    logoutBtn.textContent = dict.loggingOut
    try {
      if (supabaseClient) await supabaseClient.auth.signOut()
    } catch (err) {
      console.error('Sign out failed:', err)
    }
    window.location.href = 'login.html'
  })
  </script>
</body>
</html>
