<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZOO - Log In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- INTRO (logo + flames + ring) ---------- */
  .intro {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .intro.hidden {
    opacity: 0;
    transform: scale(0.94);
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 340px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shark-sprite {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 340px;
    height: auto;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.10));
    transition: transform 0.12s ease-out;
  }

  /* Quick punchy scale-kick on each frame change, like a bite snap */
  .shark-sprite.bite-kick {
    animation: biteKick 0.16s ease-out 1;
  }

  @keyframes biteKick {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }

  /* Flame wisps sliding in from the corners */
  .flame {
    position: fixed;
    z-index: 1;
    width: 45vw;
    max-width: 620px;
    opacity: 0;
    pointer-events: none;
  }

  .flame-left {
    left: 0;
    bottom: 6%;
    transform: translateX(-75%) translateY(20%) rotate(-4deg);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .flame-right {
    right: 0;
    bottom: 6%;
    transform: translateX(75%) translateY(20%) scaleX(-1) rotate(-4deg);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .stage.launching .flame-left {
    opacity: 1;
    transform: translateX(-25%) translateY(-4%) rotate(-2deg);
  }

  .stage.launching .flame-right {
    opacity: 1;
    transform: translateX(25%) translateY(-4%) scaleX(-1) rotate(-2deg);
  }

  .stage.fading .flame,
  .stage.fading .shark-sprite {
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* ---------- Buttons ---------- */
  .btn-login {
    position: relative;
    z-index: 5;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px 56px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-login:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .btn-login:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .guest-link {
    position: relative;
    z-index: 5;
    background: none;
    border: none;
    color: #3B5BDB;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    line-height: 1.5;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  .guest-link:hover { text-decoration: underline; }

  /* ---------- LOGIN FORM (fades in after animation) ---------- */
  .login-form {
    position: absolute;
    width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .login-form.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .login-form img.form-logo {
    width: 140px;
    margin-bottom: 4px;
  }

  .login-form h1 {
    font-size: 20px;
    font-weight: 800;
    color: #1a1a2e;
  }

  .field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.4px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #e3e3ec;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .field input:focus {
    border-color: #3B5BDB;
  }

  .form-error {
    width: 100%;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    white-space: pre-wrap;
    font-family: monospace;
  }

  .form-error.visible { display: block; }

  .submit-btn {
    width: 100%;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }

  .submit-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .submit-btn:disabled {
    opacity: 0.7;
    cursor: default;
  }

  .back-link {
    background: none;
    border: none;
    color: #999;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .back-link:hover { color: #666; }

  /* Shown at the top of the stage if Supabase itself never loaded */
  .load-error {
    display: none;
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
    white-space: pre-wrap;
    z-index: 20;
  }

  .load-error.visible { display: block; }

  @media (max-width: 480px) {
    .logo-wrap { width: 240px; height: 170px; }
    .shark-sprite { max-width: 240px; }
    .flame { width: 65vw; }
    .login-form { width: 88%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shark-sprite.bite-kick { animation: none; }
    .flame, .shark-sprite, .intro, .login-form { transition-duration: 0.15s; }
  }
</style>
</head>
<body>

  <div class="stage" id="stage">

    <div class="load-error" id="load-error"></div>

    <!-- Flame wisps -->
    <img src="assets/flame-b.png.PNG" class="flame flame-left" alt="" />
    <img src="assets/flame-a.PNG" class="flame flame-right" alt="" />

    <!-- Intro: shark bite sequence + buttons -->
    <div class="intro" id="intro">
      <div class="logo-wrap">
        <img src="assets/shark-1.png" class="shark-sprite" id="shark-sprite" alt="ZOO" />
      </div>
      <button class="btn-login" id="login-trigger">LOG IN</button>
      <button class="guest-link" id="guest-btn">PROCEED<br />AS GUEST</button>
    </div>

    <!-- Login form -->
    <form class="login-form" id="login-form">
      <img src="assets/logo.png.PNG" class="form-logo" alt="ZOO" />
      <h1>Welcome back</h1>

      <div class="form-error" id="form-error">Something went wrong.</div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">LOG IN</button>
      <button type="button" class="back-link" id="back-btn">&larr; Back</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Grab elements + bind buttons FIRST, unconditionally ----------
    // This guarantees LOG IN / GUEST / BACK always respond, even if
    // Supabase itself fails to load below.
    const stage = document.getElementById('stage')
    const intro = document.getElementById('intro')
    const loginForm = document.getElementById('login-form')
    const loginTrigger = document.getElementById('login-trigger')
    const guestBtn = document.getElementById('guest-btn')
    const backBtn = document.getElementById('back-btn')
    const formError = document.getElementById('form-error')
    const submitBtn = document.getElementById('submit-btn')
    const loadErrorEl = document.getElementById('load-error')

    function showError(message) {
      formError.textContent = message
      formError.classList.add('visible')
    }

    function clearError() {
      formError.classList.remove('visible')
    }

    function showLoadError(message) {
      loadErrorEl.textContent = message
      loadErrorEl.classList.add('visible')
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(label + ' timed out after ' + ms + 'ms — check your network or Supabase project status')), ms)
        )
      ])
    }

    const sharkSprite = document.getElementById('shark-sprite')
    const sharkFrames = [
      'assets/shark-1.png', // calm, mouth closed
      'assets/shark-2.png', // mouth opening
      'assets/shark-3.png', // mouth wide open
      'assets/shark-4.png'  // chomp shut / snap
    ]

    function playBiteSequence() {
      // Step through frames 2, 3, 4 with a quick punchy scale-kick on each,
      // landing on the "chomp shut" frame right before the form fades in.
      const stepDelay = 150
      sharkFrames.slice(1).forEach((frame, i) => {
        setTimeout(() => {
          sharkSprite.src = frame
          sharkSprite.classList.remove('bite-kick')
          // force reflow so the animation class can be re-triggered
          void sharkSprite.offsetWidth
          sharkSprite.classList.add('bite-kick')
        }, stepDelay * (i + 1))
      })
    }

    loginTrigger.addEventListener('click', () => {
      if (stage.classList.contains('launching')) return
      stage.classList.add('launching')
      playBiteSequence()

      setTimeout(() => {
        stage.classList.add('fading')
      }, 1300)

      setTimeout(() => {
        intro.classList.add('hidden')
        loginForm.classList.add('visible')
        document.getElementById('email').focus()
        // Reset the sprite so it's back to the calm frame if the user hits Back
        sharkSprite.src = sharkFrames[0]
      }, 1700)
    })

    guestBtn.addEventListener('click', () => {
      window.location.href = 'index.html'
    })

    backBtn.addEventListener('click', () => {
      loginForm.classList.remove('visible')
      intro.classList.remove('hidden')
      stage.classList.remove('launching', 'fading')
      sharkSprite.src = sharkFrames[0]
      sharkSprite.classList.remove('bite-kick')
      clearError()
      loginForm.reset()
    })

    // ---------- Supabase init (guarded) ----------
    if (!window.supabase) {
      showLoadError(
        'The Supabase library did not load from the CDN.\n' +
        'This is usually caused by an ad blocker, content blocker, ' +
        '"Prevent Cross-Site Tracking", or Lockdown Mode blocking cdn.jsdelivr.net.\n' +
        'Login will not work until this loads — try disabling content ' +
        'blockers for this site, or open it in a different browser.'
      )
      submitBtn.disabled = true
    } else {
      const SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

      // Redirect immediately if already logged in
      withTimeout(supabaseClient.auth.getUser(), 8000, 'getUser')
        .then(({ data: { user } }) => {
          if (user) window.location.href = 'index.html'
        })
        .catch(err => {
          console.error('getUser check failed:', err)
          // Non-fatal: just means we couldn't pre-check; let them log in manually.
        })

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        clearError()

        const email = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value

        submitBtn.disabled = true
        submitBtn.textContent = 'LOGGING IN...'

        try {
          const { error } = await withTimeout(
            supabaseClient.auth.signInWithPassword({ email, password }),
            8000, 'signInWithPassword'
          )

          if (error) {
            showError(error.message)
            submitBtn.disabled = false
            submitBtn.textContent = 'LOG IN'
            return
          }

          window.location.href = 'index.html'
        } catch (err) {
          console.error('Login failed:', err)
          showError(
            (err && (err.message || err.error_description || err.toString())) ||
            'Unknown error while logging in.'
          )
          submitBtn.disabled = false
          submitBtn.textContent = 'LOG IN'
        }
      })
    }
  </script>
</body>
</html>
