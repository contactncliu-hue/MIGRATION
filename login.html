<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZOO - Log In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- INTRO (logo + flames + ring) ---------- */
  .intro {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .intro.hidden {
    opacity: 0;
    transform: scale(0.94);
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 460px;
    height: 320px;
    margin-top: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    position: relative;
    z-index: 5;
    width: 380px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.08));
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .stage.launching .logo-img {
    animation: logoPulse 1.4s ease-in-out 1;
  }

  /* Logo never disappears — at the instant the shark clamps shut, the
     shark is drawn ON TOP of it (see .stage.chomp .shark-sprite below)
     so it visually reads as biting the logo, not erasing it. */

  @keyframes logoPulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.1); }
    60%  { transform: scale(0.98); }
    100% { transform: scale(1); }
  }

  /* Ring / spiral swirl behind the logo — slow, lazy spin.
     Nudged up from dead-center: the artwork's flame spikes carry visual
     weight toward the bottom of its own bounding box, so a plain 50/50
     center reads as sitting low, hanging near the button instead of
     wrapping the logo. */
  .ring-img {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    width: 640px;
    max-width: none;
    opacity: 0.55;
    transform: translate(-50%, -68%) scale(1) rotate(0deg);
    transition: opacity 0.6s ease;
    pointer-events: none;
    animation: ringSpin 11s linear infinite, ringPulse 2.6s ease-in-out infinite;
  }

  @keyframes ringSpin {
    from { transform: translate(-50%, -68%) scale(1) rotate(0deg); }
    to   { transform: translate(-50%, -68%) scale(1) rotate(360deg); }
  }

  @keyframes ringPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* Shark bite sequence — sits BEHIND the logo (z-index below it) and
     is sized big enough that the logo reads as sitting inside its open
     mouth, the way the reference art shows the "ZOO" wordmark framed by
     the teeth. */
  .shark-sprite {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 3;
    width: 155%;
    max-width: 620px;
    height: auto;
    opacity: 0;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.10));
    transition: opacity 0.25s ease, transform 0.18s ease-out;
  }

  .stage.shark-active .shark-sprite {
    opacity: 1;
  }

  /* At the chomp instant the shark jumps above the logo's stacking order
     so its closed-mouth art visually clamps over the wordmark. */
  .stage.chomp .shark-sprite {
    z-index: 6;
  }

  /* Each open frame sits slightly bigger and slightly higher than the
     last — a smooth glide, not a bounce — so the shark reads as
     approaching/lunging closer before the final chomp settles back to
     the resting size and position. */
  .shark-sprite.frame-2 {
    transform: translate(-50%, -57%) scale(1.1);
  }

  .shark-sprite.frame-3 {
    transform: translate(-50%, -64%) scale(1.2);
  }

  /* Flames flanking the LOG IN button — big, low, swept in from the
     screen edges (see reference), not bunched up in the middle */
  .btn-flame-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flame {
    position: fixed;
    top: 57vh;
    z-index: 1;
    width: 48vw;
    min-width: 320px;
    max-width: 700px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Left flame runs bigger than the right, so it needs to start further
     off-canvas at rest or its faded tail-end shows on screen */
  .flame-left {
    left: 0;
    width: 60vw;
    max-width: 860px;
    transform: translate(-115%, -50%) rotate(-4deg);
  }

  .flame-right {
    right: 0;
    transform: translate(100%, -50%) scaleX(-1) rotate(-4deg);
  }

  /* Launch: left sweeps in bigger but stays pulled back so its faded
     tail-end stays off the true screen edge; right eases in short of
     the edge so it clears the LOG IN button */
  .stage.launching .flame-left {
    opacity: 1;
    transform: translate(-14%, -46%) rotate(-2deg);
  }

  .stage.launching .flame-right {
    opacity: 1;
    transform: translate(9%, -46%) scaleX(-1) rotate(-2deg);
  }

  .stage.fading .flame,
  .stage.fading .shark-sprite,
  .stage.fading .ring-img {
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  /* ---------- Buttons ---------- */
  .btn-login {
    position: relative;
    z-index: 5;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px 56px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-login:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .btn-login:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .guest-link {
    position: relative;
    z-index: 5;
    background: none;
    border: none;
    color: #3B5BDB;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    line-height: 1.5;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  .guest-link:hover { text-decoration: underline; }

  /* ---------- LOGIN FORM (fades in after animation) ---------- */
  .login-form {
    position: absolute;
    width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .login-form.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .login-form img.form-logo {
    width: 140px;
    margin-bottom: 4px;
  }

  .login-form h1 {
    font-size: 20px;
    font-weight: 800;
    color: #1a1a2e;
  }

  .field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.4px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #e3e3ec;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .field input:focus {
    border-color: #3B5BDB;
  }

  .form-error {
    width: 100%;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    white-space: pre-wrap;
    font-family: monospace;
  }

  .form-error.visible { display: block; }

  .submit-btn {
    width: 100%;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }

  .submit-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .submit-btn:disabled {
    opacity: 0.7;
    cursor: default;
  }

  .back-link {
    background: none;
    border: none;
    color: #999;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .back-link:hover { color: #666; }

  /* Shown at the top of the stage if Supabase itself never loaded */
  .load-error {
    display: none;
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
    white-space: pre-wrap;
    z-index: 20;
  }

  .load-error.visible { display: block; }

  @media (max-width: 480px) {
    .logo-wrap { width: 320px; height: 220px; margin-top: 36px; }
    .logo-img { width: 260px; }
    .ring-img { width: 440px; }
    .shark-sprite { max-width: 420px; }
    .flame { width: 60vw; min-width: 220px; max-width: 380px; top: 57vh; }
    .flame-left { width: 72vw; max-width: 460px; transform: translate(-115%, -50%) rotate(-4deg); }
    .stage.launching .flame-left { transform: translate(-14%, -46%) rotate(-2deg); }
    .stage.launching .flame-right { transform: translate(9%, -46%) scaleX(-1) rotate(-2deg); }
    .login-form { width: 88%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shark-sprite { transition-duration: 0.15s; }
    .flame, .shark-sprite, .ring-img, .intro, .login-form { transition-duration: 0.15s; }
  }
</style>
</head>
<body>

  <div class="stage" id="stage">

    <div class="load-error" id="load-error"></div>

    <!-- Intro: logo (idle) -> ring + shark bite sequence (on click) + buttons -->
    <div class="intro" id="intro">
      <div class="logo-wrap">
        <img src="assets/ring.png.PNG" class="ring-img" alt="" />
        <img src="assets/shark-1.PNG" class="shark-sprite" id="shark-sprite" alt="" />
        <img src="assets/logo.png.PNG" class="logo-img" alt="ZOO" />
      </div>
      <img src="assets/flame-b.png.PNG" class="flame flame-left" alt="" />
      <img src="assets/flame-a.PNG" class="flame flame-right" alt="" />
      <div class="btn-flame-wrap">
        <button class="btn-login" id="login-trigger">LOG IN</button>
      </div>
      <button class="guest-link" id="guest-btn">PROCEED<br />AS GUEST</button>
    </div>

    <!-- Login form -->
    <form class="login-form" id="login-form">
      <img src="assets/logo.png.PNG" class="form-logo" alt="ZOO" />
      <h1>Welcome back</h1>

      <div class="form-error" id="form-error">Something went wrong.</div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">LOG IN</button>
      <button type="button" class="back-link" id="back-btn">&larr; Back</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Grab elements + bind buttons FIRST, unconditionally ----------
    // This guarantees LOG IN / GUEST / BACK always respond, even if
    // Supabase itself fails to load below.
    const stage = document.getElementById('stage')
    const intro = document.getElementById('intro')
    const loginForm = document.getElementById('login-form')
    const loginTrigger = document.getElementById('login-trigger')
    const guestBtn = document.getElementById('guest-btn')
    const backBtn = document.getElementById('back-btn')
    const formError = document.getElementById('form-error')
    const submitBtn = document.getElementById('submit-btn')
    const loadErrorEl = document.getElementById('load-error')

    function showError(message) {
      formError.textContent = message
      formError.classList.add('visible')
    }

    function clearError() {
      formError.classList.remove('visible')
    }

    function showLoadError(message) {
      loadErrorEl.textContent = message
      loadErrorEl.classList.add('visible')
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(label + ' timed out after ' + ms + 'ms — check your network or Supabase project status')), ms)
        )
      ])
    }

    const sharkSprite = document.getElementById('shark-sprite')
    const sharkFrames = [
      'assets/shark-1.PNG', // calm, mouth closed
      'assets/shark-2.PNG', // mouth opening
      'assets/shark-3.PNG', // mouth wide open
      'assets/shark-4.PNG'  // chomp shut / snap
    ]

    function kickFrame(src, kickClass) {
      sharkSprite.src = src
      sharkSprite.classList.remove('frame-2', 'frame-3')
      if (kickClass) sharkSprite.classList.add(kickClass)
    }

    loginTrigger.addEventListener('click', () => {
      if (stage.classList.contains('launching')) return
      stage.classList.add('launching')
      // Timeline (~4.6s total, shark portion sped up further):
      //  0.0s  logo pulses, flames begin their slow, smooth sweep in from the edges
      //  0.9s  shark fades in behind the logo, open-mouthed, logo still visible inside it
      //  1.3s  mouth opening further — shark grows slightly and rises, like it's lunging closer
      //  1.9s  mouth wide open — grows/rises again, closing the distance
      //  2.7s  chomp shut (snap) — shark glides back to resting size, and jumps in
      //        front of the logo so it visually clamps shut over it ("biting it off")
      //  3.6s  everything fades
      //  4.1s  login form appears
      setTimeout(() => stage.classList.add('shark-active'), 900)
      setTimeout(() => kickFrame(sharkFrames[1], 'frame-2'), 1300)
      setTimeout(() => kickFrame(sharkFrames[2], 'frame-3'), 1900)
      setTimeout(() => {
        kickFrame(sharkFrames[3], null)
        stage.classList.add('chomp')
      }, 2700)

      setTimeout(() => {
        stage.classList.add('fading')
      }, 3600)

      setTimeout(() => {
        intro.classList.add('hidden')
        loginForm.classList.add('visible')
        document.getElementById('email').focus()
        // Reset so it's back to the idle logo if the user hits Back later
        sharkSprite.src = sharkFrames[0]
        sharkSprite.classList.remove('frame-2', 'frame-3')
        stage.classList.remove('shark-active', 'chomp')
      }, 4100)
    })

    guestBtn.addEventListener('click', () => {
      window.location.href = 'index.html'
    })

    backBtn.addEventListener('click', () => {
      loginForm.classList.remove('visible')
      intro.classList.remove('hidden')
      stage.classList.remove('launching', 'fading', 'shark-active', 'chomp')
      sharkSprite.src = sharkFrames[0]
      sharkSprite.classList.remove('frame-2', 'frame-3')
      clearError()
      loginForm.reset()
    })

    // ---------- Supabase init (guarded) ----------
    if (!window.supabase) {
      showLoadError(
        'The Supabase library did not load from the CDN.\n' +
        'This is usually caused by an ad blocker, content blocker, ' +
        '"Prevent Cross-Site Tracking", or Lockdown Mode blocking cdn.jsdelivr.net.\n' +
        'Login will not work until this loads — try disabling content ' +
        'blockers for this site, or open it in a different browser.'
      )
      submitBtn.disabled = true
    } else {
      const SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

      // Redirect immediately if already logged in
      withTimeout(supabaseClient.auth.getUser(), 8000, 'getUser')
        .then(({ data: { user } }) => {
          if (user) window.location.href = 'index.html'
        })
        .catch(err => {
          console.error('getUser check failed:', err)
          // Non-fatal: just means we couldn't pre-check; let them log in manually.
        })

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        clearError()

        const email = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value

        submitBtn.disabled = true
        submitBtn.textContent = 'LOGGING IN...'

        try {
          const { error } = await withTimeout(
            supabaseClient.auth.signInWithPassword({ email, password }),
            8000, 'signInWithPassword'
          )

          if (error) {
            showError(error.message)
            submitBtn.disabled = false
            submitBtn.textContent = 'LOG IN'
            return
          }

          window.location.href = 'index.html'
        } catch (err) {
          console.error('Login failed:', err)
          showError(
            (err && (err.message || err.error_description || err.toString())) ||
            'Unknown error while logging in.'
          )
          submitBtn.disabled = false
          submitBtn.textContent = 'LOG IN'
        }
      })
    }
  </script>
</body>
</html>
