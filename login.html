<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZOO - Log In</title>
<script>
  // iOS Safari (especially iPadOS with a tab bar visible) doesn't always
  // recalculate 100dvh correctly on the very first paint after a refresh —
  // it can briefly measure against a stale/incorrect height, which is what
  // was pushing the ring/logo/flames down. window.innerHeight is the one
  // source that reliably reflects the ACTUAL visible viewport at any given
  // moment, so we measure it ourselves into a CSS var and keep it updated.
  //
  // FIX: prefer visualViewport.height when available (more reliable than
  // innerHeight for tracking iOS toolbar collapse/expand), and also listen
  // on visualViewport's own resize event, since that fires more reliably
  // than window 'resize' while iOS is still settling its chrome.
  function setAppHeight() {
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight
    document.documentElement.style.setProperty('--app-height', h + 'px')
  }
  setAppHeight()
  window.addEventListener('resize', setAppHeight)
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setAppHeight)
  }
  window.addEventListener('orientationchange', () => {
    // iOS reports innerHeight before it finishes settling the toolbar after
    // a rotation, so re-measure a couple of times shortly after.
    setAppHeight()
    setTimeout(setAppHeight, 50)
    setTimeout(setAppHeight, 300)
  })
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) setAppHeight()
  })

  // FIX: on a cold refresh, iPad Safari sometimes doesn't fire 'load' the
  // same way (or fires it before the toolbar has actually settled), which
  // is why the earlier single 300ms retry wasn't enough. 'pageshow' fires
  // reliably on both fresh loads and bfcache restores, so we hook height
  // re-measurement there too, with a longer/extra retry window since iPad
  // settles slower than iPhone.
  window.addEventListener('pageshow', () => {
    setAppHeight()
    requestAnimationFrame(() => requestAnimationFrame(setAppHeight))
    setTimeout(setAppHeight, 400)
    setTimeout(setAppHeight, 900)

    // FIX (the actual "ring is low" bug): the ring is the only element with
    // a continuously-running CSS animation from page load (ringSpin /
    // ringPulse). iOS Safari composites actively-animating transforms into
    // their own GPU layer using whatever layout pass was current when the
    // animation started — which on a cold refresh is often BEFORE the
    // toolbar/dvh has settled. Static elements (logo, shark, flames) get a
    // clean repaint once --app-height corrects itself, but the ring's
    // compositor layer doesn't get rebuilt until something forces a full
    // re-layout — which is exactly what rotating the device does today.
    // Instead of relying on rotation, force that rebuild ourselves once
    // things have settled.
    setTimeout(() => {
      const ring = document.querySelector('.ring-img')
      if (!ring) return
      ring.style.animation = 'none'
      void ring.offsetHeight // force reflow
      ring.style.animation = ''
    }, 950)
  })
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    min-height: calc(var(--app-height, 100dvh));
    background: linear-gradient(to top, #FFFAF1, #ffffff);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 100vh;
    height: 100dvh;
    height: calc(var(--app-height, 100dvh));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- INTRO (logo + flames + ring) ---------- */
  .intro {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .intro.hidden {
    opacity: 0;
    transform: scale(0.94);
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 460px;
    height: 320px;
    margin-top: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    position: relative;
    z-index: 5;
    width: 380px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.08));
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .stage.launching .logo-img {
    animation: logoPulse 1s ease-in-out 1;
  }

  /* Logo never disappears — at the instant the shark clamps shut, the
     shark is drawn ON TOP of it (see .stage.chomp .shark-sprite below)
     so it visually reads as biting the logo, not erasing it. */

  @keyframes logoPulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.1); }
    60%  { transform: scale(0.98); }
    100% { transform: scale(1); }
  }

  /* Ring / spiral swirl behind the logo — slow, lazy spin.
     The ring artwork itself is bottom-heavy (its flame spikes carry more
     visual weight below center than above), so a literal 50/50 center
     still reads as low. Nudged up slightly to compensate and read as
     visually centered on the logo. */
  /* Ring / spiral swirl behind the logo — locked to dead center directly
     behind the logo (no offset/bias), rotating in place. */
  .ring-img {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    width: 640px;
    max-width: none;
    opacity: 0.55;
    transform: translate(-50%, -50%) rotate(0deg);
    transform-origin: center center;
    transition: opacity 0.6s ease;
    pointer-events: none;
    animation: ringSpin 11s linear infinite, ringPulse 2.6s ease-in-out infinite;
  }

  @keyframes ringSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes ringPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* Shark bite sequence — sits BEHIND the logo (z-index below it) and
     is sized big enough that the logo reads as sitting inside its open
     mouth, the way the reference art shows the "ZOO" wordmark framed by
     the teeth. Sped up + tightened transitions for a snappier, more
     seamless bite. */
  .shark-sprite {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 3;
    width: 155%;
    max-width: 620px;
    height: auto;
    opacity: 0;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.10));
    transition: opacity 0.2s ease, transform 0.16s ease-out;
  }

  .stage.shark-active .shark-sprite {
    opacity: 1;
  }

  /* At the chomp instant the shark jumps above the logo's stacking order
     so its closed-mouth art visually clamps over the wordmark. */
  .stage.chomp .shark-sprite {
    z-index: 6;
  }

  /* Each open frame sits slightly bigger and slightly higher than the
     last — a smooth glide, not a bounce — so the shark reads as
     approaching/lunging closer before the final chomp settles back to
     the resting size and position. */
  .shark-sprite.frame-2 {
    transform: translate(-50%, -57%) scale(1.1);
  }

  .shark-sprite.frame-3 {
    transform: translate(-50%, -64%) scale(1.2);
  }

  /* Landscape scenery flanking the bottom corners — always visible (not
     tied to .launching), sits behind everything else. Same split-asset
     approach as the flames: on narrow phone screens the two halves need
     to run big enough to nearly meet in the middle (per reference), on
     wider iPad/desktop screens they read as smaller accents with a big
     gap of gradient showing between them, so each side is sized
     independently per breakpoint below rather than as one shared value. */
  .scene {
    position: fixed;
    bottom: 0;
    z-index: 0;
    height: auto;
    pointer-events: none;
  }

  .scene-left {
    left: 0;
    width: 34vw;
    max-width: 380px;
  }

  .scene-right {
    right: 0;
    width: 34vw;
    max-width: 380px;
  }

  /* Flames flanking the LOG IN button — big, low, swept in from the
     screen edges, sized/positioned to match reference art: wide, low,
     nearly full bleed off each side. */
  .btn-flame-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flame {
    position: fixed;
    top: 60vh;
    top: 60dvh;
    top: calc(var(--app-height, 100dvh) * 0.6);
    z-index: 1;
    width: 60vw;
    min-width: 380px;
    max-width: 840px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Left flame runs bigger than the right, so it needs to start further
     off-canvas at rest or its faded tail-end shows on screen */
  .flame-left {
    left: 0;
    width: 82vw;
    max-width: 1140px;
    transform: translate(-132%, -50%) rotate(-3deg);
  }

  /* Right flame uses the SAME orientation as the left (no mirroring) —
     mirroring flipped its internal curl direction and made it read
     wrong against the reference art. */
  .flame-right {
    right: 0;
    transform: translate(103%, -50%) rotate(-3deg);
  }

  /* Launch: both flames sweep in wide and low to match the reference —
     held back well clear of center so they stay spread toward the
     edges, not bunched together in the middle. Left is bigger, so it
     stays further out than the right to avoid crowding center and to
     keep its faded tail off-screen. */
  .stage.launching .flame-left {
    opacity: 1;
    transform: translate(-42%, -44%) rotate(-3deg);
  }

  .stage.launching .flame-right {
    opacity: 1;
    transform: translate(23%, -44%) rotate(-3deg);
  }

  .stage.fading .flame,
  .stage.fading .shark-sprite,
  .stage.fading .ring-img {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* ---------- Buttons ---------- */
  .btn-login {
    position: relative;
    z-index: 5;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px 56px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-login:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .btn-login:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .guest-link {
    position: relative;
    z-index: 5;
    background: none;
    border: none;
    color: #3B5BDB;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    line-height: 1.5;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  .guest-link:hover { text-decoration: underline; }

  /* ---------- LOGIN FORM (fades in after animation) ---------- */
  .login-form {
    position: absolute;
    width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .login-form.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .login-form img.form-logo {
    width: 140px;
    margin-bottom: 4px;
  }

  .login-form h1 {
    font-size: 20px;
    font-weight: 800;
    color: #1a1a2e;
  }

  .field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.4px;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #e3e3ec;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .field input:focus {
    border-color: #3B5BDB;
  }

  .form-error {
    width: 100%;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    white-space: pre-wrap;
    font-family: monospace;
  }

  .form-error.visible { display: block; }

  .form-success {
    width: 100%;
    background: #f0fff4;
    color: #2b8a3e;
    border: 1px solid #d3f9d8;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }

  .form-success.visible { display: block; }

  .submit-btn {
    width: 100%;
    background: #f2a90f;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c98c0c;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }

  .submit-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #c98c0c;
  }

  .submit-btn:disabled {
    opacity: 0.7;
    cursor: default;
  }

  .back-link {
    background: none;
    border: none;
    color: #999;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .back-link:hover { color: #666; }

  /* New-here / sign-up prompt shown under the login form */
  .signup-prompt {
    width: 100%;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #888;
  }

  .signup-prompt .signup-link-btn {
    background: none;
    border: none;
    color: #3B5BDB;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  .signup-prompt .signup-link-btn:hover { text-decoration: underline; }

  /* Shown at the top of the stage if Supabase itself never loaded */
  .load-error {
    display: none;
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    background: #fff0f0;
    color: #e03131;
    border: 1px solid #ffd6d6;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
    white-space: pre-wrap;
    z-index: 20;
  }

  .load-error.visible { display: block; }

  @media (max-width: 480px) {
    .logo-wrap { width: 320px; height: 220px; margin-top: 36px; }
    .logo-img { width: 260px; }
    .ring-img { width: 440px; }
    .shark-sprite { max-width: 420px; }
    .flame { width: 72vw; min-width: 260px; max-width: 460px; top: 60vh; top: 60dvh; top: calc(var(--app-height, 100dvh) * 0.6); }
    .scene-left,
    .scene-right { width: 62vw; max-width: 340px; }
    .flame-left { width: 92vw; max-width: 600px; transform: translate(-132%, -50%) rotate(-3deg); }
    .stage.launching .flame-left { transform: translate(-42%, -44%) rotate(-3deg); }
    .stage.launching .flame-right { transform: translate(23%, -44%) rotate(-3deg); }
    .login-form { width: 88%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shark-sprite { transition-duration: 0.1s; }
    .flame, .shark-sprite, .ring-img, .intro, .login-form { transition-duration: 0.1s; }
  }
</style>
</head>
<body>

  <div class="stage" id="stage">

    <div class="load-error" id="load-error"></div>

    <!-- Background landscape scenery — always visible, sits behind everything -->
    <img src="assets/scene-left.png" class="scene scene-left" alt="" />
    <img src="assets/scene-right.png" class="scene scene-right" alt="" />

    <!-- Intro: logo (idle) -> ring + shark bite sequence (on click) + buttons -->
    <div class="intro" id="intro">
      <div class="logo-wrap">
        <img src="assets/ring.png.png" class="ring-img" alt="" />
        <img src="assets/shark-1.PNG" class="shark-sprite" id="shark-sprite" alt="" />
        <img src="assets/logo.png.PNG" class="logo-img" alt="ZOO" />
      </div>
      <img src="assets/flame-b.png.png" class="flame flame-left" alt="" />
      <img src="assets/flame-a.png" class="flame flame-right" alt="" />
      <div class="btn-flame-wrap">
        <button class="btn-login" id="login-trigger">LOG IN</button>
      </div>
      <button class="guest-link" id="guest-btn">PROCEED<br />AS GUEST</button>
    </div>

    <!-- Login / Sign up form -->
    <form class="login-form" id="login-form">
      <img src="assets/logo.png.PNG" class="form-logo" alt="ZOO" />
      <h1 id="form-title">Welcome back</h1>

      <div class="form-error" id="form-error">Something went wrong.</div>
      <div class="form-success" id="form-success"></div>

      <div class="field">
        <label for="username" id="username-label">Username</label>
        <input type="text" id="username" autocomplete="username" minlength="3" pattern="[A-Za-z0-9_\-]+" title="Letters, numbers, - and _ only" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">LOG IN</button>

      <div class="signup-prompt" id="signup-prompt">
        Don't have an account?
        <button type="button" class="signup-link-btn" id="signup-toggle-btn">Sign up</button>
      </div>

      <button type="button" class="back-link" id="back-btn">&larr; Back</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Grab elements + bind buttons FIRST, unconditionally ----------
    // This guarantees LOG IN / GUEST / BACK always respond, even if
    // Supabase itself fails to load below.
    const stage = document.getElementById('stage')
    const intro = document.getElementById('intro')
    const loginForm = document.getElementById('login-form')
    const loginTrigger = document.getElementById('login-trigger')
    const guestBtn = document.getElementById('guest-btn')
    const backBtn = document.getElementById('back-btn')
    const formError = document.getElementById('form-error')
    const formSuccess = document.getElementById('form-success')
    const submitBtn = document.getElementById('submit-btn')
    const loadErrorEl = document.getElementById('load-error')

    // Re-measure once more after full load (and shortly after), since the
    // iPad Safari toolbar can still settle into its final size a moment
    // after DOMContentLoaded/inline-script time.
    if (typeof setAppHeight === 'function') {
      window.addEventListener('load', () => {
        setAppHeight()
        setTimeout(setAppHeight, 300)
      })
    }
    const formTitle = document.getElementById('form-title')
    const signupPrompt = document.getElementById('signup-prompt')
    const signupToggleBtn = document.getElementById('signup-toggle-btn')

    // Whether the form is currently in "sign up" mode or "log in" mode
    let mode = 'login'

    // Supabase auth needs an email under the hood, but the UI only ever
    // collects a username (both for sign up AND log in) — this maps a
    // username to a stable synthetic email so no real email is required.
    function usernameToAuthEmail(username) {
      return username.trim().toLowerCase().replace(/\s+/g, '') + '@zoo-app.local'
    }

    function showError(message) {
      formSuccess.classList.remove('visible')
      formError.textContent = message
      formError.classList.add('visible')
    }

    function clearError() {
      formError.classList.remove('visible')
    }

    function showSuccess(message) {
      formError.classList.remove('visible')
      formSuccess.textContent = message
      formSuccess.classList.add('visible')
    }

    function clearSuccess() {
      formSuccess.classList.remove('visible')
    }

    function showLoadError(message) {
      loadErrorEl.textContent = message
      loadErrorEl.classList.add('visible')
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error(label + ' timed out after ' + ms + 'ms — check your network or Supabase project status')), ms)
        )
      ])
    }

    function setMode(newMode) {
      mode = newMode
      clearError()
      clearSuccess()
      if (mode === 'signup') {
        formTitle.textContent = 'Create your account'
        submitBtn.textContent = 'SIGN UP'
        signupPrompt.innerHTML = 'Already have an account? <button type="button" class="signup-link-btn" id="signup-toggle-btn">Log in</button>'
      } else {
        formTitle.textContent = 'Welcome back'
        submitBtn.textContent = 'LOG IN'
        signupPrompt.innerHTML = "Don't have an account? <button type=\"button\" class=\"signup-link-btn\" id=\"signup-toggle-btn\">Sign up</button>"
      }
      // Re-bind, since innerHTML replaced the button node
      document.getElementById('signup-toggle-btn').addEventListener('click', () => {
        setMode(mode === 'login' ? 'signup' : 'login')
      })
    }

    signupToggleBtn.addEventListener('click', () => {
      setMode(mode === 'login' ? 'signup' : 'login')
    })

    const sharkSprite = document.getElementById('shark-sprite')
    const sharkFrames = [
      'assets/shark-1.PNG', // calm, mouth closed
      'assets/shark-2.PNG', // mouth opening
      'assets/shark-3.PNG', // mouth wide open
      'assets/shark-4.PNG'  // chomp shut / snap
    ]

    function kickFrame(src, kickClass) {
      sharkSprite.src = src
      sharkSprite.classList.remove('frame-2', 'frame-3')
      if (kickClass) sharkSprite.classList.add(kickClass)
    }

    loginTrigger.addEventListener('click', () => {
      if (stage.classList.contains('launching')) return
      stage.classList.add('launching')
      // Timeline (~4.0s total — nudged a couple hundred ms slower again
      // after feeling slightly too fast):
      //  0.0s  logo pulses, flames begin their sweep in from the edges
      //  0.9s  shark fades in behind the logo, open-mouthed, logo still visible inside it
      //  1.2s  mouth opening further — shark grows slightly and rises, like it's lunging closer
      //  1.5s  mouth wide open — grows/rises again, closing the distance
      //  2.0s  chomp shut (snap) — shark glides back to resting size, and jumps in
      //        front of the logo so it visually clamps shut over it ("biting it off")
      //  2.55s everything fades
      //  2.95s login form appears
      setTimeout(() => stage.classList.add('shark-active'), 900)
      setTimeout(() => kickFrame(sharkFrames[1], 'frame-2'), 1200)
      setTimeout(() => kickFrame(sharkFrames[2], 'frame-3'), 1500)
      setTimeout(() => {
        kickFrame(sharkFrames[3], null)
        stage.classList.add('chomp')
      }, 2000)

      setTimeout(() => {
        stage.classList.add('fading')
      }, 2550)

      setTimeout(() => {
        intro.classList.add('hidden')
        loginForm.classList.add('visible')
        document.getElementById('username').focus()
        // Reset so it's back to the idle logo if the user hits Back later
        sharkSprite.src = sharkFrames[0]
        sharkSprite.classList.remove('frame-2', 'frame-3')
        stage.classList.remove('shark-active', 'chomp')
      }, 2950)
    })

    guestBtn.addEventListener('click', () => {
      window.location.href = 'index.html'
    })

    backBtn.addEventListener('click', () => {
      loginForm.classList.remove('visible')
      intro.classList.remove('hidden')
      stage.classList.remove('launching', 'fading', 'shark-active', 'chomp')
      sharkSprite.src = sharkFrames[0]
      sharkSprite.classList.remove('frame-2', 'frame-3')
      clearError()
      clearSuccess()
      loginForm.reset()
      setMode('login')
    })

    // ---------- Supabase init (guarded) ----------
    if (!window.supabase) {
      showLoadError(
        'The Supabase library did not load from the CDN.\n' +
        'This is usually caused by an ad blocker, content blocker, ' +
        '"Prevent Cross-Site Tracking", or Lockdown Mode blocking cdn.jsdelivr.net.\n' +
        'Login will not work until this loads — try disabling content ' +
        'blockers for this site, or open it in a different browser.'
      )
      submitBtn.disabled = true
    } else {
      const SUPABASE_URL = "https://nlqzanjivjfkftvazrvi.supabase.co"
      const SUPABASE_ANON_KEY = "sb_publishable_M3WiVkgt6yctuilI5Q0IjQ_djrAu238"
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

      // Redirect immediately if already logged in
      withTimeout(supabaseClient.auth.getUser(), 8000, 'getUser')
        .then(({ data: { user } }) => {
          if (user) window.location.href = 'index.html'
        })
        .catch(err => {
          console.error('getUser check failed:', err)
          // Non-fatal: just means we couldn't pre-check; let them log in manually.
        })

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        clearError()
        clearSuccess()

        const username = document.getElementById('username').value.trim()
        const password = document.getElementById('password').value
        const authEmail = usernameToAuthEmail(username)

        submitBtn.disabled = true
        submitBtn.textContent = mode === 'signup' ? 'SIGNING UP...' : 'LOGGING IN...'

        try {
          if (mode === 'signup') {
            const { data, error } = await withTimeout(
              supabaseClient.auth.signUp({
                email: authEmail,
                password,
                options: { data: { username } }
              }),
              8000, 'signUp'
            )

            if (error) {
              showError(error.message)
              submitBtn.disabled = false
              submitBtn.textContent = 'SIGN UP'
              return
            }

            // If email confirmation is on, there's no session yet.
            if (data && data.session) {
              window.location.href = 'index.html'
            } else {
              showSuccess('Account created! You can log in now.')
              submitBtn.disabled = false
              submitBtn.textContent = 'SIGN UP'
              setMode('login')
            }
          } else {
            const { error } = await withTimeout(
              supabaseClient.auth.signInWithPassword({ email: authEmail, password }),
              8000, 'signInWithPassword'
            )

            if (error) {
              showError(error.message)
              submitBtn.disabled = false
              submitBtn.textContent = 'LOG IN'
              return
            }

            window.location.href = 'index.html'
          }
        } catch (err) {
          console.error((mode === 'signup' ? 'Sign up' : 'Login') + ' failed:', err)
          showError(
            (err && (err.message || err.error_description || err.toString())) ||
            'Unknown error while ' + (mode === 'signup' ? 'signing up.' : 'logging in.')
          )
          submitBtn.disabled = false
          submitBtn.textContent = mode === 'signup' ? 'SIGN UP' : 'LOG IN'
        }
      })
    }
  </script>
</body>
</html>
